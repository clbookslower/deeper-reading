/* ─── 개념 카드 14종 ────────────────────────────────────────────── */
const CONCEPTS = [
  { id:"techunemployment", term:"기술적 실업", latin:"Technological Unemployment · Keynes 1930",
    keyword:"기술이 노동을 영구적으로 대체할 것인가—케인스의 질문",
    desc:"존 메이너드 케인스가 1930년 논문 '우리 손자 세대의 경제적 가능성(Economic Possibilities for our Grandchildren)'에서 처음 명명. 기술이 인간의 노동을 영구적으로 대체해 구조적 실업을 만들 수 있다는 우려.\n\n케인스의 역설: 그는 이 위험을 경고하면서도, 결국 기술이 인류를 풍요롭게 해 2030년에는 주 15시간만 일해도 된다고 낙관했다. 그의 낙관론은 생산성 향상 예측에서는 맞았지만—노동 시간 단축 예측은 빗나갔다.\n\n커즈와일의 위치: 케인스의 낙관론 계보에 서 있지만, 그 근거를 수확 가속의 법칙으로 제시한다.",
    example:"1930년 케인스: '100년 후 우리 손자들은 경제 문제를 해결했을 것이다.' 2030년은 그 100년이 되는 해다. 케인스의 예측 중 무엇은 맞았고 무엇은 틀렸는가—이것이 5장의 출발점이다.", accent:"#5a9abc" },

  { id:"luddite", term:"러다이트의 오류", latin:"Luddite Fallacy",
    keyword:"기술은 일자리를 파괴하면서 동시에 창출한다",
    desc:"19세기 초 영국 방직 노동자들(러다이트)이 방직 기계를 파괴하며 기술이 일자리를 영구적으로 없앨 것이라고 주장했다. 그러나 역사는 다르게 진행됐다.\n\n실제 역사:\n• 방직 기계 → 섬유 산업 확장 → 더 많은 노동자 필요\n• 자동화 → 생산성 향상 → 가격 하락 → 수요 증가 → 새 일자리\n• 농업 기계화 → 도시 제조업 노동자 증가\n\n오류의 핵심: '일자리의 총량은 고정되어 있다'는 전제가 틀렸다. 기술은 새로운 수요와 새로운 직업을 창출한다.\n\n그러나 이번에는: AI가 인지 작업을 자동화하면서 이 오류가 여전히 오류인지 논쟁 중이다.",
    example:"ATM기 도입 이후 은행 창구 직원 수는 증가했다. ATM이 창구 비용을 낮추자 은행이 더 많은 지점을 열었고, 영업·상담 등 더 복잡한 고객 서비스 직원이 더 필요해졌다. 기술이 일자리를 파괴하면서 동시에 창출하는 대표적 사례다.", accent:"#c4a35a" },

  { id:"lumpoflab", term:"노동 총량의 오류", latin:"Lump of Labor Fallacy",
    keyword:"경제에서 일자리 총량은 고정되어 있지 않다",
    desc:"'세상에 일자리의 총량은 정해져 있어서, 기술이 일자리를 없애면 남는 사람이 생긴다'는 잘못된 전제. 경제학자들이 노동 시장 논쟁에서 가장 자주 반박하는 오류 중 하나.\n\n실증: 산업혁명 이후 인구가 10배 늘었지만 실업률은 장기적으로 증가하지 않았다. 경제는 새로운 수요를 만들어내고, 그 수요가 새로운 일자리를 창출한다.\n\n커즈와일의 적용: 수확 가속의 법칙이 새로운 산업과 직업을 기하급수적으로 창출한다. 문제는 그 창출 속도가 파괴 속도를 따라가는가—전환기의 속도다.",
    example:"1900년 미국 노동력의 41%가 농업 종사자였다. 지금은 2% 미만이다. 그 39%의 사람들은 어디로 갔는가—자동차 정비사, 파일럿, 프로그래머, 소셜 미디어 매니저가 됐다. 1900년에는 이 직업들이 존재하지 않았다.", accent:"#9a7abd" },

  { id:"polarization", term:"노동 시장 양극화", latin:"Labor Market Polarization · Autor 2006",
    keyword:"중간 소득 직업이 사라지고 고소득·저소득으로 양극화된다",
    desc:"MIT 경제학자 다비드 아우토르가 2006년 제시한 개념. 자동화가 '일상적이고 반복적인 작업'을 대체하면서—중간 소득 직업(사무직·생산직)이 감소하고, 고소득(전문직·창의직)과 저소득(서비스직·돌봄직) 직업으로 양극화된다.\n\n자동화가 쉬운 직업: 규칙 기반·반복적·예측 가능 (회계, 데이터 입력, 조립 라인)\n자동화가 어려운 직업: 창의적·사회적·물리적 적응 (예술, 상담, 플러머)\n\nAI 시대의 변화: LLM이 인지 작업(법률 문서 검토, 의학 진단, 코딩)까지 자동화하면서—아우토르의 모델이 깨질 수 있다.",
    example:"1980년대 이후 미국의 고소득 직업(의사·변호사·엔지니어)과 저소득 직업(식당 종업원·청소부)은 증가했지만, 중간 소득 직업(비서·은행원·공장 직원)은 감소했다. 이것이 소득 불평등 심화의 구조적 원인 중 하나다.", accent:"#6aaa82" },

  { id:"frey", term:"47% 논문", latin:"Frey & Osborne · Oxford 2013",
    keyword:"현재 직업의 47%가 자동화 고위험 상태다",
    desc:"칼 베네딕트 프레이·마이클 오스본의 옥스퍼드 연구(2013). 미국 직업의 47%가 자동화 고위험 상태라고 분석. 가장 많이 인용되는 자동화 위험 연구.\n\n방법론: 702개 직업을 분석해 컴퓨터화 가능성(susceptibility to computerization) 점수 부여.\n\n고위험 직업: 텔레마케터(99%)·회계사(94%)·부동산 중개인(86%)·요리사(96%)·건설 노동자(88%)\n저위험 직업: 레크리에이션 치료사(0.28%)·사회복지사(0.35%)·치과의사(0.44%)·성직자(0.81%)\n\n비판: OECD 반론(2016)—직업 단위가 아니라 과제(task) 단위로 분석하면 자동화 위험이 9%로 낮아진다.",
    example:"이 연구가 나온 후 10년: 회계사와 부동산 중개인은 아직 존재한다. 그러나 그들의 업무 내용은 극적으로 바뀌었다. '직업의 소멸'보다 '직업 내 과제의 변환'이 더 정확한 묘사다.", accent:"#c47a7a" },

  { id:"complementarity", term:"보완 효과", latin:"Complementarity Effect",
    keyword:"AI는 인간 노동을 대체하는가, 보완하는가",
    desc:"경제학에서 기술이 노동을 대체(substitution)하는지 보완(complementarity)하는지를 구분하는 개념.\n\n대체 효과: 기계가 인간 노동을 직접 대신함 → 같은 생산량을 더 적은 노동으로 달성\n보완 효과: 기술이 인간 노동의 생산성을 높임 → 인간 노동의 수요와 임금이 증가\n\n커즈와일의 주장: AI는 단기적으로 일부 과제를 대체하지만, 장기적으로 인간 역량을 증폭시켜 더 높은 수준의 일을 가능하게 한다.\n\n실증 사례: GitHub Copilot 도입 후 프로그래머 생산성 55% 향상(MIT·스탠퍼드 연구, 2022). 대체가 아니라 증폭이다.",
    example:"방사선과 의사: AI 진단 보조 도구 도입 후 더 많은 이미지를 더 빠르게 검토하게 됐다. 진단 정확도가 높아지고 더 복잡한 케이스에 집중할 수 있게 됐다. 단순 판독 과제는 AI가, 복잡한 판단은 의사가 담당하는 분업.", accent:"#aaba5a" },

  { id:"gpt_econ", term:"범용 기술", latin:"General Purpose Technology · GPT",
    keyword:"경제 전체를 재편하는 기반 기술",
    desc:"경제학에서 GPT(General Purpose Technology)는 여러 산업에 광범위하게 적용되어 경제 전체를 재편하는 기반 기술을 의미한다. AI의 AI(artificial intelligence)와 혼동하지 않도록 주의.\n\n역사적 GPT 사례:\n• 증기기관(1780년대): 제조·운송 전반 재편\n• 전기(1890년대): 모든 산업의 동력원 교체\n• 컴퓨터(1970~80년대): 정보 처리 전반 재편\n\nAI = 4번째 GPT: 이전 GPT들과의 결정적 차이—AI는 지식 노동(knowledge work)을 자동화한다. 이전 GPT들은 주로 육체 노동을 자동화했다.\n\n브린욜프슨·맥아피 《제2의 기계 시대》(2014): AI는 지식의 GPT다.",
    example:"전기가 공장에 도입됐을 때, 초기에는 생산성이 오히려 하락했다(1880~1920년대). 기업들이 전기에 맞게 공장 구조를 재설계하는 데 30~40년이 걸렸다. AI도 마찬가지—진짜 생산성 향상은 사회 전체가 AI에 맞게 재조직되는 것을 기다린다.", accent:"#5a7abc" },

  { id:"comparative", term:"비교 우위", latin:"Comparative Advantage",
    keyword:"절대 우위가 없어도 교역은 가능하다—인간도 마찬가지",
    desc:"데이비드 리카도의 국제무역 이론. 어떤 나라가 모든 분야에서 절대 열위여도, 상대적으로 더 잘 하는 분야에 특화하면 무역이 이익이 된다.\n\n커즈와일의 AI 적용: AI가 모든 인지 과제에서 인간보다 뛰어나져도—인간은 상대적으로 더 잘 하는 분야에 특화함으로써 가치를 창출할 수 있다.\n\n인간의 비교 우위 후보:\n• 감정 지능(EQ)·공감·진정성\n• 신체적 유연성·적응력\n• 도덕적 책임과 판단\n• 창의적 비전과 목적 설정\n• 인간 관계와 신뢰",
    example:"체스에서 AI가 인간을 완전히 능가한다. 그러나 '켄타우르 체스(Centaur Chess)'—인간과 AI의 팀—은 AI 단독보다 강할 수 있다. 인간의 직관과 AI의 계산력이 결합할 때 시너지가 발생한다.", accent:"#bc7a7a" },

  { id:"augmentation", term:"증강과 협업", latin:"Augmentation & Human-AI Collaboration",
    keyword:"AI가 대체가 아닌 증폭기가 되는 조건",
    desc:"커즈와일이 5장에서 강조하는 핵심 프레임. AI는 인간의 일을 없애는 것이 아니라 인간이 더 높은 수준의 일을 할 수 있도록 증폭시킨다.\n\n증강이 작동하는 방식:\n• 반복적·규칙적 과제 → AI가 처리\n• 판단·창의·감성 과제 → 인간이 집중\n• 결과: 인간의 생산성이 기하급수적으로 향상\n\n실증: GitHub Copilot 도입 후 개발자 생산성 55% 향상(MIT·스탠퍼드, 2022). 의사 AI 진단 보조 도구—오진율 감소 + 처리량 증가.\n\n전제 조건: 이 증강이 작동하려면—교육 시스템과 직업 훈련이 AI 시대에 맞게 재설계되어야 한다.",
    example:"법률 분야: 법률 검색·문서 검토 AI 도입 후 변호사들이 더 복잡한 전략적 법률 조언에 집중할 수 있게 됐다. 단순 리서치에 드는 시간이 줄고, 의뢰인과의 심층 상담에 더 많은 시간을 쓸 수 있다.", accent:"#c4a35a" },

  { id:"ubi", term:"보편적 기본 소득", latin:"Universal Basic Income · UBI",
    keyword:"모든 시민에게 조건 없이 지급하는 기본 소득",
    desc:"AI로 인한 일자리 소멸에 대한 정책적 대응으로 자주 논의되는 개념. 국가가 모든 시민에게 고용 상태와 무관하게 최소 생활 가능한 소득을 지급한다.\n\nUBI 지지 논거:\n• AI가 경제적 가치를 창출하는 만큼 그 이익을 모든 시민이 누려야 한다\n• 전환기에 사람들이 재교육할 시간·자원을 확보할 수 있다\n• 소비를 유지해 경제를 안정시킨다\n\nUBI 반론:\n• 재원 조달 문제\n• 노동 의욕 감소 우려\n• 인플레이션 가능성\n\n실험 사례: 핀란드(2017~2018), 케냐(GiveDirectly), 미국 스톡턴·알래스카 영구기금",
    example:"알래스카 영구기금: 1982년부터 석유 수익을 모든 주민에게 배당. 2023년 1인당 약 $1,702 지급. 알래스카는 미국에서 소득 불평등이 가장 낮은 주 중 하나다. 완전한 UBI는 아니지만—부분적 자원 배당의 효과를 보여주는 사례.", accent:"#9a7abd" },

  { id:"newwork", term:"새로운 일자리 창출", latin:"New Work Creation · Autor",
    keyword:"기술이 아직 존재하지 않는 직업들을 만들어낸다",
    desc:"MIT 경제학자 다비드 아우토르의 '새로운 일(New Work)' 연구. 기술 진보는 단순히 기존 일자리를 대체하는 것이 아니라—이전에는 존재하지 않았던 완전히 새로운 종류의 일자리를 창출한다.\n\n아우토르의 발견: 2018년 현재 미국 일자리의 약 60%는 1940년에는 존재하지 않았던 직업이다.\n\n새로 창출된 직업 사례:\n• 소셜 미디어 매니저\n• 데이터 과학자\n• UX 디자이너\n• 유튜버\n• AI 프롬프트 엔지니어\n• AI 윤리 연구자\n\n커즈와일: 수확 가속의 법칙이 지속되면 이 새로운 직업 창출 속도도 기하급수적으로 가속된다.",
    example:"2010년에는 '유튜버'라는 직업이 없었다. 지금은 전 세계에 수백만 명의 유튜버가 있다. '프롬프트 엔지니어'는 2022년 이전에는 존재하지 않았다. 기술 가속은 직업 창출 가속을 동반한다.", accent:"#6aaa82" },

  { q:"커즈와일은 '수확 가속의 법칙이 새 직업 창출도 가속한다'고 말합니다. 지금 존재하지 않지만 10년 후에는 존재할 직업은 무엇이라고 생각합니까? 그 직업을 위해 지금 무엇을 준비해야 합니까?",
    hint:"'소셜 미디어 매니저'는 2010년에 없었고, '프롬프트 엔지니어'는 2022년에 없었습니다. 10년 뒤의 새 직업을 예측하는 것과, 그 불확실성 속에서 어떤 역량을 키울 것인가—두 질문 중 어느 것이 더 중요합니까?" },
];

/* ─── 스테이지 ──────────────────────────────────────────────────── */
const STAGES = {

function App() {
  const [page, setPage] = useState(0);

  const [posOpen, setPosOpen] = useState(null);
  const [seminHints, setSeminHints] = useState(new Set());

  const TOTAL = 11;
  const go = n => { setFading(true); setTimeout(()=>{ setPage(n); setFading(false); window.scrollTo(0,0); }, 280); };
  const next = () => { if(page < TOTAL-1) go(page+1); };
  const prev = () => { if(page > 0) go(page-1); };

  const C = { bg:"#090b0d", surf:"#0e1318", surfUp:"#151d24", txt:"#e2e8f0", muted:"#607080", gold:"#c4a35a", goldBr:"#deb96a", line:"#1e2a35" };
  const F = { h:"'Cormorant Garamond', Georgia, serif", b:"'Noto Serif KR', Georgia, serif" };
  const W = { maxWidth:720, margin:"0 auto", padding:"52px 28px", color:C.txt, fontFamily:F.b };
  const SL = { fontFamily:F.b, fontSize:11, letterSpacing:4, color:C.gold, marginBottom:18, display:"block" };
  const BT = { fontFamily:F.h, fontSize:32, fontWeight:400, color:C.txt, lineHeight:1.25, marginBottom:8 };
  const DIV = { width:36, height:1, background:C.gold, marginBottom:28 };
  const BD = { fontSize:15, lineHeight:1.95, color:C.txt, fontWeight:300, fontFamily:F.b };
  const MT = { fontSize:15, lineHeight:1.95, color:C.muted, fontWeight:300, fontFamily:F.b };

  const stageKey = PAGE_STAGE[page];
  const stage = stageKey ? STAGES[stageKey] : null;

  const StageBadge = () => !stage ? null : (
    <div style={{ display:"flex", gap:10, alignItems:"center", marginBottom:28, padding:"10px 16px", background:stage.bg, border:`1px solid ${stage.color}33`, width:"fit-content" }}>
      <div style={{ width:6, height:6, borderRadius:"50%", background:stage.color }} />
      <span style={{ fontFamily:F.b, fontSize:11, letterSpacing:4, color:stage.color }}>{stage.label}</span>
      <span style={{ fontFamily:F.h, fontSize:13, color:C.muted, fontStyle:"italic" }}>{stage.latin}</span>
      <span style={{ fontFamily:F.b, fontSize:11, color:C.muted }}>· {stage.sub}</span>
    </div>
  );

  const renderPage = () => { switch(page) {

  case 0: return (
    <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column", justifyContent:"center", alignItems:"center", textAlign:"center", padding:"48px 28px", background:C.bg, position:"relative", overflow:"hidden" }}>
      <div style={{ position:"absolute", top:0, left:0, right:0, height:2, background:`linear-gradient(90deg,transparent,${C.gold},transparent)` }} />
      <div style={{ position:"absolute", bottom:0, left:0, right:0, height:1, background:`linear-gradient(90deg,transparent,${C.gold}44,transparent)` }} />
      <div style={{ position:"absolute", inset:0, backgroundImage:`radial-gradient(ellipse at 50% 55%,#1a100a 0%,transparent 65%)`, pointerEvents:"none" }} />
      <span style={{ fontFamily:F.b, fontSize:11, letterSpacing:6, color:C.gold, marginBottom:48, display:"block" }}>디퍼 언브랜딩살롱</span>
      <h1 style={{ fontFamily:F.h, fontSize:"clamp(32px,7vw,52px)", fontWeight:300, color:C.txt, lineHeight:1.1, marginBottom:10 }}>마침내 특이점이 시작된다</h1>
      <p style={{ fontFamily:F.h, fontSize:18, color:"#b0bec8", fontStyle:"italic", marginBottom:6 }}>The Singularity Is Nearer</p>
      <p style={{ fontFamily:F.b, fontSize:12, color:"#b0bec8", letterSpacing:2 }}>Ray Kurzweil, 2024 · 비즈니스북스</p>
      <div style={{ width:1, height:52, background:`linear-gradient(${C.gold}88,transparent)`, margin:"36px auto" }} />
      <p style={{ fontFamily:F.b, fontSize:13, letterSpacing:5, color:C.gold, marginBottom:10 }}>소크라테스식 고전 탐구 세미나</p>
      <p style={{ fontFamily:F.h, fontSize:19, color:"#b0bec8", fontStyle:"italic", marginBottom:16 }}>제5장</p>
      <p style={{ fontFamily:F.h, fontSize:17, color:"#b0bec8", fontStyle:"italic", marginBottom:52 }}>일자리의 미래: 좋은 쪽 혹은 나쁜 쪽?</p>
      <button onClick={next}
        onMouseEnter={e=>{e.currentTarget.style.background=C.gold;e.currentTarget.style.color=C.bg;}}
        onMouseLeave={e=>{e.currentTarget.style.background="transparent";e.currentTarget.style.color=C.gold;}}
        style={{ background:"transparent", border:`1px solid ${C.gold}`, color:C.gold, fontFamily:F.b, fontSize:12, letterSpacing:4, padding:"15px 48px", cursor:"pointer", transition:"all 0.3s" }}>
        시작하기
      </button>
      <div style={{ display:"flex", gap:24, marginTop:40, justifyContent:"center" }}>
        {[["문법","#c4a35a"],["논리","#5a9abc"],["수사","#bc7a7a"]].map(([l,col])=>(
          <div key={l} style={{ textAlign:"center" }}>
            <div style={{ width:5, height:5, borderRadius:"50%", background:col, margin:"0 auto 6px" }} />
            <span style={{ fontFamily:F.b, fontSize:10, color:col, letterSpacing:3 }}>{l}</span>
          </div>
        ))}
      </div>
    </div>
  );

  case 1: return (
    <div style={W}>
      <span style={SL}>안내 · 트리비움으로 읽다</span>
      <h2 style={BT}>세 단계로 읽는 법</h2>
      <div style={DIV} />
      <p style={{ ...BD, marginBottom:32 }}>이 세미나는 생각을 이끄는 도구, <strong style={{color:C.goldBr}}>트리비움</strong>으로 텍스트를 읽습니다—<strong style={{color:C.goldBr}}>문법, 논리, 수사</strong>. 각 단계는 텍스트를 다른 깊이로 만나는 방법입니다.</p>
      {[
        { key:"grammar", n:"01", label:"문법 — Grammatica", pages:"5섹션",
          desc:"5장의 핵심 개념과 언어를 내 것으로 만드는 단계입니다.",
          items:["기술적 실업·러다이트의 오류·노동 총량의 오류·노동 시장 양극화·47% 논문·보완 효과·범용 기술·비교 우위·증강과 협업·UBI·새로운 일자리 창출·재교육·아제모을루의 반론·전환기 개념 카드 (14종)","핵심 논점 3개—역사적 패턴과 AI의 특수성 / 대체 vs 증폭 / 전환기의 속도 문제","이해 확인 퀴즈 4문항"] },
        { key:"logic", n:"02", label:"논리 — Dialectica", pages:"2섹션",
          desc:"'그래서 우리는 어디로 가고 있는가?'—커즈와일이 전환기의 위험들을 인정하면서도 어떻게 낙관하는지 논거를 단계별로 따라갑니다.",
          items:["핵심 물음 → 위험 인정 → 역사적 귀납 → 비교 우위·증강 → 기회의 크기","기술 낙관론 vs 기술 비관론 vs 제도적 접근 비교"] },
        { key:"rhetoric", n:"03", label:"수사 — Rhetorica", pages:"세미나에서 함께",
          desc:"이 단계는 세미나 현장에서 함께 합니다.",
          items:["소크라테스식 세미나 토론 질문 5개","힌트와 함께 입장 준비"] },
      ].map(item=>{
        const s=STAGES[item.key];
        return (
          <div key={item.key} style={{ marginBottom:20, background:C.surf, padding:"22px 24px", borderLeft:`3px solid ${s.color}` }}>
            <div style={{ display:"flex", gap:14, alignItems:"flex-start", marginBottom:14 }}>
              <span style={{ fontFamily:F.h, fontSize:30, color:s.color, lineHeight:1, minWidth:32 }}>{item.n}</span>
              <div>
                <div style={{ display:"flex", gap:10, alignItems:"center", marginBottom:6 }}>
                  <span style={{ fontFamily:F.b, fontSize:11, letterSpacing:4, color:s.color }}>{item.label}</span>
                  <span style={{ fontFamily:F.b, fontSize:11, color:C.muted }}>· {item.pages}</span>
                </div>
                <p style={{ ...BD, fontSize:13, margin:0, lineHeight:1.8 }}>{item.desc}</p>
              </div>
            </div>
            <div style={{ paddingLeft:46 }}>
              {item.items.map((it,j)=>(
                <div key={j} style={{ display:"flex", gap:10, alignItems:"flex-start", padding:"4px 0" }}>
                  <div style={{ width:4, height:4, borderRadius:"50%", background:s.color+"88", flexShrink:0, marginTop:7 }} />
                  <span style={{ ...MT, fontSize:13 }}>{it}</span>
                </div>
              ))}
            </div>
          </div>
        );
      })}
    </div>
  );

  case 2: return (
    <div style={W}>
      <StageBadge />
      <span style={SL}>문법 1/5 · 핵심 개념</span>
      <h2 style={BT}>카드를 눌러 개념을 확인하세요</h2>
      <div style={DIV} />
      <p style={{ ...MT, marginBottom:36, fontSize:14 }}>14개 모두 열어보시길 권합니다. 지금 완전히 이해하지 않아도 됩니다—이후 독해와 퀴즈를 통해 다시 만납니다.</p>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
        {CONCEPTS.map(c=>{
          const open=flipped.has(c.id);
          return (
            <div key={c.id}
              onClick={()=>{const n=new Set(flipped);if(n.has(c.id))n.delete(c.id);else n.add(c.id);setFlipped(n);}}
              style={{ background:open?C.surfUp:C.surf, border:`1px solid ${open?c.accent+"66":C.line}`, padding:"18px 20px", cursor:"pointer", transition:"all 0.25s" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
                <div style={{ flex:1, paddingRight:8 }}>
                  <p style={{ fontFamily:F.h, fontSize:17, color:open?c.accent:C.goldBr, fontWeight:500, margin:"0 0 2px", lineHeight:1.25 }}>{c.term}</p>
                  <p style={{ fontSize:10, color:C.muted, fontStyle:"italic", margin:0 }}>{c.latin}</p>
                </div>
                <span style={{ color:open?C.gold:C.muted, fontSize:20, lineHeight:1, transform:open?"rotate(45deg)":"none", transition:"transform 0.25s", flexShrink:0 }}>+</span>
              </div>
              {open && (
                <div style={{ marginTop:16 }}>
                  <p style={{ fontSize:11, color:c.accent, letterSpacing:3, marginBottom:10, fontWeight:500 }}>{c.keyword}</p>
                  <p style={{ ...BD, fontSize:13, marginBottom:14, lineHeight:1.85, whiteSpace:"pre-line" }}>{c.desc}</p>
                  <div style={{ background:C.surf, padding:"12px 14px" }}>
                    <p style={{ ...MT, fontSize:12, margin:0, lineHeight:1.8 }}>✦ {c.example}</p>
                  </div>
                </div>
              )}
            </div>
          );

      </div>
      <div style={{ textAlign:"center", marginTop:28 }}>
        <span style={{ ...MT, fontSize:12, letterSpacing:2 }}>{flipped.size} / {CONCEPTS.length} 확인</span>
        <div style={{ display:"flex", justifyContent:"center", gap:5, marginTop:10, flexWrap:"wrap" }}>
          {CONCEPTS.map((c,i)=><div key={i} style={{ width:6, height:6, borderRadius:"50%", background:flipped.has(c.id)?C.gold:C.line, transition:"background 0.3s" }} />)}
        </div>
      </div>
    </div>
  );

  case 3: case 4: case 5: {
    const pIdx=page-3, p=PASSAGES[pIdx], layer=pLayers[pIdx];
    return (
      <div style={W}>
        <StageBadge />
        <span style={SL}>문법 {pIdx+2}/5 · 핵심 논점 {pIdx+1}/3</span>
        <h2 style={BT}>{p.title}</h2>
        <div style={DIV} />
        <div style={{ background:"#0d1a0d", border:`1px solid #1e3a1e`, padding:"18px 22px", marginBottom:28 }}>
          <p style={{ fontSize:11, color:"#4a8a4a", letterSpacing:3, marginBottom:8 }}>책에서 찾아보기</p>
          <p style={{ ...BD, fontSize:13, margin:0, color:"#8abb8a", lineHeight:1.85 }}>{p.note}</p>
        </div>
        <p style={{ ...MT, fontSize:12, marginBottom:16, letterSpacing:1 }}>아래 탭을 순서대로 눌러 이해의 층을 쌓아보세요</p>
        <div style={{ display:"flex" }}>
          {p.layers.map((l,i)=>(
            <button key={i} onClick={()=>setPLayers(prev=>{const n=[...prev];n[pIdx]=i;return n;})}
              style={{ flex:1, padding:"12px 8px", background:layer===i?C.surfUp:C.surf, border:"none", borderBottom:`2px solid ${layer===i?C.gold:C.line}`, color:layer===i?C.gold:C.muted, fontFamily:F.b, fontSize:12, letterSpacing:2, cursor:"pointer", transition:"all 0.2s" }}>
              {l.label}
            </button>
          ))}
        </div>
        <div style={{ background:C.surfUp, padding:"28px 26px", minHeight:148, borderTop:`1px solid ${C.line}`, marginBottom:32 }}>
          <p style={{ ...BD, margin:0, lineHeight:2.1, whiteSpace:"pre-line" }}>{p.layers[layer].text}</p>
        </div>
        {pIdx<2 && (
          <div style={{ display:"flex", justifyContent:"center" }}>
            <button onClick={next} style={{ background:"transparent", border:`1px solid ${C.line}`, color:C.muted, fontFamily:F.b, fontSize:12, letterSpacing:3, padding:"10px 28px", cursor:"pointer" }}>
              다음 논점으로 →
            </button>
          </div>
        )}
      </div>
    );
  }

  case 6: return (
    <div style={W}>
      <StageBadge />

      <h2 style={BT}>이해 확인 퀴즈</h2>
      <div style={DIV} />

      {QUIZ.map((q,qi)=>(
        <div key={qi} style={{ marginBottom:40 }}>
          <div style={{ display:"flex", gap:14, marginBottom:16, alignItems:"flex-start" }}>

            return (
              <div key={oi} onClick={()=>{if(!done){const n=[...qSel];n[qi]=oi;setQSel(n);}}}
                style={{ background:bg, border:`1px solid ${border}`, padding:"13px 18px", marginBottom:8, cursor:done?"default":"pointer", display:"flex", gap:14, alignItems:"flex-start", transition:"all 0.2s" }}>

                {done&&correct&&<span style={{ marginLeft:"auto", color:"#3a7a3a", fontSize:16, flexShrink:0 }}>✓</span>}

              <p style={{ ...BD, fontSize:13, color:"#90bb90", margin:0, lineHeight:1.85 }}>{q.exp}</p>

          <div style={{ display:"flex", alignItems:"stretch" }}>
            <div style={{ width:4, background:step.color, flexShrink:0 }} />
            <div style={{ background:i===argStep?C.surfUp:C.surf, padding:"20px 24px", flex:1 }}>
              <div style={{ display:"flex", gap:12, alignItems:"center", marginBottom:10 }}>
                <span style={{ fontFamily:F.b, fontSize:10, letterSpacing:4, color:step.color }}>{step.num}</span>
                <span style={{ fontFamily:F.h, fontSize:18, color:i===argStep?C.txt:C.muted }}>{step.title}</span>
              </div>
              <p style={{ ...BD, fontSize:14, lineHeight:1.95, marginBottom:12, whiteSpace:"pre-line" }}>{step.body}</p>
              <div style={{ padding:"10px 14px", background:C.bg, borderLeft:`2px solid ${step.color}44` }}>
                <p style={{ ...MT, fontSize:12, margin:0, color:step.color }}>✦ {step.key}</p>
              </div>
            </div>
          </div>
        </div>
      ))}
      <div style={{ display:"flex", gap:14, marginTop:24, alignItems:"center" }}>
        {argStep<ARG_STEPS.length-1 ? (
          <button onClick={()=>setArgStep(s=>s+1)}
            onMouseEnter={e=>{e.currentTarget.style.background=ARG_STEPS[argStep+1].color;e.currentTarget.style.color=C.bg;}}
            onMouseLeave={e=>{e.currentTarget.style.background="transparent";e.currentTarget.style.color=ARG_STEPS[argStep+1].color;}}
            style={{ padding:"12px 28px", background:"transparent", border:`1px solid ${ARG_STEPS[argStep+1].color}`, color:ARG_STEPS[argStep+1].color, fontFamily:F.b, fontSize:12, letterSpacing:3, cursor:"pointer", transition:"all 0.3s" }}>
            다음 →
          </button>
        ) : (
          <span style={{ ...MT, fontSize:12, letterSpacing:2, color:C.gold }}>논증 완료</span>
        )}
        {argStep>0 && <button onClick={()=>setArgStep(0)} style={{ background:"transparent", border:"none", color:C.muted, fontFamily:F.b, fontSize:11, letterSpacing:2, cursor:"pointer" }}>처음부터</button>}
        <span style={{ marginLeft:"auto", ...MT, fontSize:11 }}>{argStep+1} / {ARG_STEPS.length}</span>
      </div>
    </div>
  );

  case 8: return (
    <div style={W}>
      <StageBadge />
      <span style={SL}>논리 2/2 · 철학적 비교</span>
      <h2 style={BT}>AI는 일자리에 좋은가—세 가지 답</h2>
      <div style={DIV} />
      <p style={{ ...MT, marginBottom:24, fontSize:14 }}>세 입장을 눌러 비교해보세요.</p>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, marginBottom:36 }}>
        {POSITIONS.map((pos,i)=>{
          const open=posOpen===i;
          return (
            <div key={i} onClick={()=>setPosOpen(open?null:i)}
              style={{ background:open?C.surfUp:C.surf, border:`1px solid ${open?pos.color+"88":C.line}`, padding:"16px 14px", cursor:"pointer", transition:"all 0.25s" }}>
              <p style={{ fontFamily:F.h, fontSize:15, color:open?pos.color:C.muted, margin:"0 0 4px", textAlign:"center", lineHeight:1.3 }}>{pos.label}</p>
              <p style={{ fontSize:10, color:C.muted, fontStyle:"italic", margin:0, textAlign:"center" }}>{pos.sub}</p>
              {open && (
                <div style={{ marginTop:14 }}>
                  <div style={{ marginBottom:10, paddingBottom:10, borderBottom:`1px solid ${C.line}` }}>
                    <p style={{ fontSize:10, color:pos.color, letterSpacing:3, marginBottom:6 }}>주장</p>
                    <p style={{ ...BD, fontSize:12, margin:0, lineHeight:1.75 }}>{pos.claim}</p>
                  </div>
                  <div style={{ marginBottom:10 }}>
                    <p style={{ fontSize:10, color:"#8a6a4a", letterSpacing:3, marginBottom:6 }}>반론·응답</p>
                    <p style={{ ...BD, fontSize:12, margin:0, lineHeight:1.75, color:"#c4a880" }}>{pos.problem}</p>
                  </div>
                  <div style={{ padding:"8px 12px", background:C.surf, borderLeft:`2px solid ${pos.color}44` }}>
                    <p style={{ fontSize:11, color:pos.color, margin:0, whiteSpace:"pre-line" }}>{pos.quote}</p>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
      <div style={{ background:C.surf, padding:"20px 24px" }}>
        <p style={{ fontFamily:F.b, fontSize:11, color:STAGES.logic.color, letterSpacing:4, marginBottom:14 }}>핵심 쟁점</p>
        <p style={{ ...BD, fontSize:14, lineHeight:1.9, margin:0 }}>
          세 입장 모두 공유하는 것: <strong style={{color:C.txt}}>AI가 일자리에 영향을 미친다는 사실.</strong> 갈라지는 것: <strong style={{color:C.txt}}>그 영향이 결국 긍정적인가, 부정적인가—그리고 그것을 결정하는 것이 기술인가, 정책인가.</strong> 커즈와일과 아제모을루의 긴장이 이 시대의 가장 중요한 경제 논쟁이다.
        </p>
      </div>
    </div>
  );

  case 9: return (
    <div style={W}>
      <StageBadge />
      <span style={SL}>수사 · 세미나 준비</span>
      <h2 style={BT}>이제 함께 탐구합니다</h2>
      <div style={DIV} />
      <div style={{ background:"#1a0f0f", border:`1px solid ${STAGES.rhetoric.color}33`, padding:"20px 24px", marginBottom:36 }}>
        <p style={{ fontFamily:F.b, fontSize:11, color:STAGES.rhetoric.color, letterSpacing:4, marginBottom:10 }}>수사 단계에 대하여</p>
        <p style={{ ...BD, fontSize:14, margin:0, lineHeight:1.9 }}>
          문법으로 텍스트를 읽고, 논리로 논증을 분석했습니다. 수사는 그것을 <strong style={{color:C.txt}}>함께 말하는 단계</strong>입니다. 5장의 수사가 향하는 핵심은—<strong style={{color:C.txt}}>나의 일은 어떻게 변하는가? 그리고 나는 무엇을 준비해야 하는가?</strong>
        </p>
      </div>
      <p style={{ fontFamily:F.b, fontSize:11, color:STAGES.rhetoric.color, letterSpacing:4, marginBottom:20 }}>세미나 토론 질문</p>
      {SEMINAR_QS.map((item,i)=>{
        const open=seminHints.has(i);
        return (
          <div key={i} style={{ marginBottom:20, background:C.surf, padding:"22px 26px", borderLeft:`3px solid ${STAGES.rhetoric.color}${i%2===0?"cc":"44"}` }}>
            <div style={{ display:"flex", gap:16, alignItems:"flex-start", marginBottom:12 }}>
              <span style={{ fontFamily:F.h, fontSize:28, color:STAGES.rhetoric.color, lineHeight:1, minWidth:34 }}>S{i+1}</span>
              <p style={{ ...BD, fontWeight:400, lineHeight:1.8, margin:0, flex:1 }}>{item.q}</p>
            </div>
            <div style={{ paddingLeft:50 }}>
              <button onClick={()=>{const n=new Set(seminHints);if(n.has(i))n.delete(i);else n.add(i);setSeminHints(n);}}
                style={{ background:"transparent", border:"none", color:C.muted, fontFamily:F.b, fontSize:11, letterSpacing:3, cursor:"pointer", padding:0 }}>
                {open?"힌트 접기 ↑":"힌트 보기 ↓"}
              </button>
              {open && (
                <div style={{ marginTop:10, padding:"12px 16px", background:C.surfUp, borderLeft:`2px solid ${STAGES.rhetoric.color}33` }}>
                  <p style={{ ...MT, fontSize:13, fontStyle:"italic", margin:0, lineHeight:1.8 }}>💡 {item.hint}</p>
                </div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );

  case 10: return (
    <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column", justifyContent:"center", alignItems:"center", textAlign:"center", padding:"48px 28px", background:C.bg, position:"relative" }}>
      <div style={{ position:"absolute", top:0, left:0, right:0, height:1, background:`linear-gradient(90deg,transparent,${C.gold}44,transparent)` }} />
      <span style={{ fontFamily:F.b, fontSize:11, letterSpacing:6, color:C.muted, marginBottom:48, display:"block" }}>디퍼 언브랜딩살롱 · 마침내 특이점이 시작된다</span>
      <div style={{ width:1, height:64, background:`linear-gradient(${C.gold}88,transparent)`, margin:"0 auto 44px" }} />
      <div style={{ background:C.surf, padding:"36px 40px", maxWidth:640, textAlign:"left", borderLeft:`3px solid ${C.gold}`, marginBottom:52 }}>
        <p style={{ fontSize:11, color:C.gold, letterSpacing:4, marginBottom:20 }}>오늘의 마지막 문장 · Ray Kurzweil · 제5장 · 일자리의 미래</p>
        <p style={{ fontFamily:F.h, fontSize:"clamp(14px,2vw,17px)", fontStyle:"italic", color:C.txt, lineHeight:2.3, margin:0 }}>
          "이 기술 발전에 내포된 기회는 실로 어마어마하다. 그것은 사실상 인류의 오랜 고통을 극복할 수 있는 기회이다."
        </p>
        <p style={{ ...MT, fontSize:12, marginTop:20, marginBottom:0, letterSpacing:2 }}>— 『마침내 특이점이 시작된다』 제5장 일자리의 미래: 좋은 쪽 혹은 나쁜 쪽?</p>
      </div>
      <div style={{ display:"flex", gap:32, marginBottom:52, justifyContent:"center" }}>
        {[["문법","Grammar","#c4a35a"],["논리","Logic","#5a9abc"],["수사","Rhetoric","#bc7a7a"]].map(([l,e,col])=>(
          <div key={l} style={{ textAlign:"center" }}>
            <div style={{ width:5, height:5, borderRadius:"50%", background:col, margin:"0 auto 8px" }} />
            <p style={{ fontFamily:F.b, fontSize:11, color:col, letterSpacing:3, marginBottom:5 }}>{l}</p>
            <p style={{ fontFamily:F.h, fontSize:13, color:C.muted, margin:0, fontStyle:"italic" }}>{e}</p>
          </div>
        ))}
      </div>
      <button onClick={()=>go(0)} style={{ background:"transparent", border:`1px solid ${C.line}`, color:C.muted, fontFamily:F.b, fontSize:11, letterSpacing:4, padding:"12px 32px", cursor:"pointer" }}>처음으로</button>
    </div>
  );

  default: return null;
  }};

  const navVisible = page>0 && page<10;
  return (
    <div style={{ background:C.bg, minHeight:"100vh" }}>
      {navVisible && (
        <div style={{ position:"fixed", top:0, left:0, right:0, height:2, background:C.line, zIndex:100 }}>
          <div style={{ height:"100%", width:`${((page-1)/8)*100}%`, background:stage?stage.color:C.gold, transition:"width 0.4s ease, background 0.4s ease" }} />
        </div>
      )}
      <div style={{ opacity:fading?0:1, transition:"opacity 0.28s ease", paddingTop:navVisible?2:0 }}>
        {renderPage()}
      </div>
      {navVisible && (
        <div style={{ maxWidth:720, margin:"0 auto", padding:"0 28px 52px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <button onClick={prev} style={{ background:"transparent", border:"none", color:C.muted, fontFamily:F.b, fontSize:12, letterSpacing:3, cursor:"pointer", padding:"12px 0" }}>← 이전</button>
          <div style={{ display:"flex", gap:4, alignItems:"center", flexWrap:"wrap", justifyContent:"center", maxWidth:160 }}>
            {Array.from({length:9},(_,i)=>{
              const ps=PAGE_STAGE[i+2], col=ps?STAGES[ps].color:C.gold, active=i===page-2, done=i<page-2;
              return <div key={i} style={{ width:active?8:5, height:active?8:5, borderRadius:"50%", background:done||active?col:C.line, transition:"all 0.3s" }} />;
            })}
          </div>
          {page<9 ? (
            <button onClick={next} style={{ background:"transparent", border:"none", color:stage?stage.color:C.gold, fontFamily:F.b, fontSize:12, letterSpacing:3, cursor:"pointer", padding:"12px 0" }}>다음 →</button>
          ) : (
            <button onClick={next}
              onMouseEnter={e=>{e.currentTarget.style.background=STAGES.rhetoric.color;e.currentTarget.style.color=C.bg;}}
              onMouseLeave={e=>{e.currentTarget.style.background="transparent";e.currentTarget.style.color=STAGES.rhetoric.color;}}
              style={{ background:"transparent", border:`1px solid ${STAGES.rhetoric.color}`, color:STAGES.rhetoric.color, fontFamily:F.b, fontSize:11, letterSpacing:3, padding:"10px 24px", cursor:"pointer", transition:"all 0.3s" }}>
              마무리
            </button>
          )}
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
