/* ─── 개념 카드 12종 ────────────────────────────────────────────── */
const CONCEPTS = [
  { id:"bioinfo", term:"생물학 = 정보 기술", latin:"Biology as Information Technology",
    keyword:"생명의 소스코드를 읽고 쓸 수 있게 됐다",
    desc:"커즈와일 6장의 핵심 전제. 생물학은 본질적으로 정보 처리 시스템이다. DNA는 소프트웨어이고, 단백질은 그 실행 결과이며, 세포는 프로세서다.\n\n이 전환이 중요한 이유: 정보 기술이 되면—수확 가속의 법칙이 적용된다. 생물학적 과정을 정보로 이해할 수 있게 되면, 버그를 찾아 패치할 수 있다.\n\n실증: 유전체 분석 비용이 2001년 $3억에서 2023년 $200 이하로 감소. 이 속도 자체가 수확 가속의 법칙이 생물학에 적용된 증거다.\n\n함의: 노화·질병·유전 장애를 소프트웨어 버그처럼 찾아 수정할 수 있다.",
    example:"인간 게놈 프로젝트: 완성에 13년·$27억 소요(1990~2003). 오늘날 같은 작업이 하루·$200 이하. 이 속도가 수확 가속의 법칙이 생물학에 적용된 결과다.", accent:"#5a9abc" },

  { id:"stages", term:"세 단계", latin:"Three Stages to Longevity",
    keyword:"특이점까지 살아있기 위한 전략적 프레임워크",
    desc:"커즈와일이 6장에서 제시하는 수명 연장의 세 단계 전략. 생물학적 수명을 특이점까지 연장하는 단계적 경로.\n\n• 1단계(지금): 영양·보충제·예방 의학으로 생물학을 최대한 활용한다. 커즈와일 자신이 하루 약 100가지 보충제를 복용하는 이유다.\n• 2단계(10~20년 후): 생명공학 혁명—유전자 편집·역분화 줄기세포·유전자 치료로 생물학을 직접 재프로그래밍한다.\n• 3단계(20~30년 후): 나노기술—혈류 속 나노봇이 세포 수준에서 의료를 수행한다.\n\n핵심 논리: 1단계가 2단계까지, 2단계가 3단계까지 살아있게 해준다. 3단계에 도달하면—수명 탈출 속도(LEV)가 달성된다.",
    example:"커즈와일의 개인적 실천: 그는 아버지를 58세에 심장병으로 잃었다. 자신이 같은 유전적 위험을 가지고 있다고 판단해—공격적인 예방 의학(1단계)으로 자신의 생물학적 나이를 실제 나이보다 낮게 유지하고 있다고 주장한다.", accent:"#c4a35a" },

  { id:"pattern_body", term:"패턴 정체성과 신체적 기질", latin:"Pattern Identity & Physical Substrate",
    keyword:"나의 생존은 신체 어느 부위의 생존에 달려있지 않다",
    desc:"3장의 패턴 정체성 이론이 6장에서 의료적 함의를 갖는다. 커즈와일의 주장: '나'는 특정 생물학적 기질(뉴런·세포·장기)이 아니라 정보 패턴이다.\n\n따라서: 생물학적 부위를 하나씩 기술적인 것으로 교체해도—패턴이 유지되는 한 '나'는 존속한다.\n\n6장에서의 적용: 인공 심장, 나노봇이 대체한 면역 세포, 디지털로 보완된 신피질—이것들 각각이 '나'를 대체하는 것이 아니라 '나'를 지속시키는 수단이다.\n\n핵심 질문: 우리 자신의 생존이 신체 어떤 부위의 생존 여부에 좌우되지 않는다는 것을—어떻게 받아들일 것인가?",
    example:"심장 이식 수술을 받은 사람: 원래의 심장이 없어도 '나'는 존속한다. 커즈와일은 이 논리를 뇌 세포 하나하나에까지 확장한다. 결국 '나'는 어떤 특정 물질이 아니라 그 물질들이 이루는 패턴이다.", accent:"#9a7abd" },

  { id:"reprogramming", term:"생물학 재프로그래밍", latin:"Reprogramming Biology",
    keyword:"노화는 수정 가능한 소프트웨어 오류다",
    desc:"커즈와일 6장의 2단계 핵심 개념. 노화를 '운명'이 아니라 '재프로그래밍 가능한 정보의 오류'로 본다.\n\n재프로그래밍의 두 방향:\n• 유전체 수준: DNA 서열의 오류를 직접 수정하거나 발현을 조절\n• 세포 수준: 노화된 세포를 젊은 상태로 되돌리거나 제거\n\n이것이 '생물학 = 소프트웨어'라는 명제의 실천적 의미다: 소프트웨어에 버그가 생기면 패치를 배포한다. 생물학도 같은 방식으로 접근하기 시작했다.\n\n현재 상태: 동물 실험에서 다수의 재프로그래밍 성공 사례. 인간 임상으로 이행하는 단계.",
    example:"야마나카 인자(Yamanaka factors): 4개의 유전자를 활성화해 성체 세포를 줄기세포 수준으로 역분화시킬 수 있다(2006년 발견, 2012년 노벨상). 이 발견이 '노화는 되돌릴 수 없다'는 전제를 뒤집었다.", accent:"#6aaa82" },

  { id:"senolytics", term:"노화 세포 제거", latin:"Senolytics",
    keyword:"분열을 멈추고 염증을 유발하는 세포를 제거한다",
    desc:"세포 노화(cellular senescence): 분열을 멈추고 염증성 물질을 분비하는 '좀비 세포'. 이것들이 조직에 축적되면서 노화·암·심장병의 원인이 된다.\n\n커즈와일의 6장 논거: 이 노화 세포를 선택적으로 제거하면 조직이 젊어진다.\n\n진행 상황: 동물 실험에서 노화 세포 제거 후 수명 25~36% 연장, 신체·인지 기능 개선 확인. 인간 임상 시험 진행 중.\n\n커즈와일의 예측: 노화 세포 제거가 2단계의 핵심 도구로 발전한다.",
    example:"생쥐 실험: 6개월령 생쥐(인간 연령 중년)에게 노화 세포를 제거하는 처리를 했을 때—수명과 건강 수명이 모두 개선됐다. '젊음의 샘'에 가장 가까이 온 기술 중 하나로 평가된다.", accent:"#c47a7a" },

  { id:"genetherapy", term:"유전자 치료", latin:"Gene Therapy",
    keyword:"결함이 있는 유전자를 수정하거나 교체한다",
    desc:"유전자 치료: 질병의 원인이 되는 유전자 결함을 직접 수정하거나, 치료 단백질을 생산하는 유전자를 세포에 전달하는 치료법.\n\n커즈와일이 6장에서 강조하는 내용: 유전자 치료가 이제 실험실을 벗어나 임상 현실이 됐다.\n\n현재 승인된 치료:\n• 겸상 적혈구 빈혈증: CRISPR 기반 Casgevy(2023 FDA 승인)\n• 척수성 근위축증(SMA): Zolgensma—단회 투여로 근치 가능\n• 혈우병: 유전자 치료로 평생 주사 필요 없어짐\n\n커즈와일의 전망: 유전자 치료가 노화 관련 유전자를 표적으로 하는 2단계로 확장된다.",
    example:"레베르 선천성 흑암시(유전성 실명): 유전자 치료 Luxturna로 실명 환자의 시력을 부분 회복. 이전까지 불치였던 유전 질환이 일회성 치료로 개선됐다. 생물학의 소프트웨어 패치가 실현된 사례다.", accent:"#aaba5a" },

  { id:"stemcell", term:"역분화 줄기세포", latin:"iPS Cells · Induced Pluripotent Stem Cells",
    keyword:"성체 세포를 줄기세포로 되돌려 조직을 재생한다",
    desc:"역분화 줄기세포(iPS): 야마나카 신야가 2006년 발견. 이미 분화된 성체 세포(피부세포 등)를 4개의 유전자로 처리해 배아 줄기세포와 유사한 상태로 역분화시킨다.\n\n중요성:\n• 윤리 논란 없이 맞춤형 줄기세포 생성 가능\n• 환자 자신의 세포로 만들어—면역 거부 반응 없음\n• 고갈된 조직·장기의 재생 가능성\n\n커즈와일의 6장 논거: iPS 세포가 2단계의 핵심 재생 의학 도구. 노화로 고갈된 줄기세포 군을 iPS 세포로 보충하면—조직 노화를 역전시킬 수 있다.",
    example:"iPS 세포 기반 파킨슨병 치료: 환자의 피부세포 → iPS 세포 → 도파민 신경세포로 분화 → 뇌에 이식. 손상된 신경세포를 환자 자신의 세포로 대체하는 개인 맞춤 재생 의학의 방향이다.", accent:"#5a7abc" },

  { id:"nanobot", term:"나노봇 의료", latin:"Nanomedicine · Nanobots",
    keyword:"혈류 속 나노봇이 세포 수준에서 의료를 수행한다",
    desc:"나노봇(nanobot): 나노미터 수준의 초소형 기계. 커즈와일의 3단계 핵심 기술.\n\n커즈와일의 비전:\n• 혈류 속 나노봇이 면역 세포를 보강하거나 대체\n• 암세포를 실시간으로 감지하고 제거\n• 노화 세포를 지속적으로 청소\n• 영양소를 세포에 직접 전달\n• 혈관 플라크 제거\n\n현재 진행:\n• DNA 나노구조(DNA origami): 약물을 암세포에 선택적 전달하는 나노 운반체\n• 나노입자 암 치료: 항암제를 종양에만 전달—부작용 감소\n• mRNA 백신의 지질 나노입자: 이미 수십억 명이 사용한 나노 전달 시스템",
    example:"코로나19 mRNA 백신: 지질 나노입자가 mRNA를 세포 내로 전달한다. 이것이 나노의학의 첫 번째 대규모 인류 적용이다. 커즈와일: 이것이 3단계 나노봇 의료의 전조다.", accent:"#bc7a7a" },

  { id:"lev", term:"장수 탈출 속도", latin:"Longevity Escape Velocity · LEV",
    keyword:"매년 과학이 수명을 1년 이상 연장하면—죽음은 계속 후퇴한다",
    desc:"커즈와일이 6장에서 목표로 제시하는 개념. 과학이 매년 남은 기대 수명을 1년 이상 연장하는 시점—이 시점이 되면 수명이 지속적으로 연장된다.\n\n커즈와일의 예측: 세 단계가 순서대로 성숙하면서 2030년대 초 LEV 달성 가능.\n\n현재 진행 속도: 20세기 동안 기대 수명이 매년 약 3개월씩 연장됐다. 생명공학 기술들이 동시에 가속되면서 이 속도가 빨라지고 있다. LEV에 도달하려면 이 속도가 연 12개월(1년)을 초과해야 한다.\n\n세 단계와의 연결: 1단계→2단계→3단계의 순서가 LEV를 달성하는 경로다.",
    example:"100미터 달리기 비유: 1초에 10미터를 달리는 선수가 있다. 출발선에서 100미터 앞에 마감선이 있다. 그런데 선수가 1초에 10미터를 달리는 동안 마감선이 15미터씩 멀어진다면—결코 도달할 수 없다. LEV는 반대 상황: 마감선(죽음)이 달리는 속도보다 느리게 이동한다.", accent:"#c4a35a" },

  { id:"gnr", term:"GNR 혁명", latin:"GNR Revolution · G·N·R",
    keyword:"유전공학·나노기술·로봇공학의 수렴이 의료를 재정의한다",
    desc:"커즈와일이 제시하는 21세기 전반기 세 기술 혁명의 수렴. 6장에서 의료에 적용되는 방식으로 논의된다.\n\n• G (유전공학·Genetics): DNA 수준에서 생명을 재프로그래밍—유전자 치료·역분화 줄기세포·유전자 편집. 2단계의 핵심.\n• N (나노기술·Nanotechnology): 원자·분자 수준에서 의료를 수행—나노봇·나노 약물 전달. 3단계의 핵심.\n• R (로봇공학·Robotics): AI 포함—신약 발견 가속·수술 로봇·AI 진단. 모든 단계를 가속.\n\nGNR이 의료에서 수렴하는 방식: G가 2단계, N이 3단계, R(AI)이 전체를 가속한다.",
    example:"mRNA 백신: G(RNA 서열 설계)·N(지질 나노입자 전달)·R(AI가 서열 최적화)가 동시에 작동했다. GNR 혁명이 코로나19에서 처음 대규모로 실현된 사례다.", accent:"#9a7abd" },

  { id:"gradual", term:"점진적 기질 교체", latin:"Gradual Substrate Replacement",
    keyword:"하나씩 교체하면 언제 내가 아닌 존재가 되는가",
    desc:"3장의 점진적 대체 사고실험이 6장에서 의료적 현실이 된다. 심장 → 인공 심장, 관절 → 인공 관절, 면역 세포 → 나노봇, 신피질 → 디지털 신피질.\n\n이미 일어나고 있는 것:\n• 심장 박동기·인공 심장: 수십만 명이 사용 중\n• 인공 와우(달팽이관): 청각 장애 치료\n• 인공 망막: 시각 장애 부분 회복\n\n커즈와일의 확장: 이 교체가 단순히 기능 회복에서 기능 향상으로, 그리고 노화 역전으로 확장된다.\n\n핵심 질문: 교체되는 비율이 높아질수록—나는 여전히 나인가? 그리고 이것이 중요한가?",
    example:"인공 심장: 자연적 심장 없이도 완전히 정상적 삶을 사는 사람들이 있다. 아무도 그들을 '인간이 아니다'라고 말하지 않는다. 커즈와일: 이 직관을 뇌 세포에까지 확장하라.", accent:"#6aaa82" },

        <p style={{ fontFamily:F.b, fontSize:11, color:STAGES.rhetoric.color, letterSpacing:4, marginBottom:10 }}>수사 단계의 핵심 질문</p>
        <p style={{ ...BD, fontSize:14, margin:0, lineHeight:1.9 }}>
          문법으로 텍스트를 읽고, 논리로 논증을 분석했습니다. 수사는 그것을 <strong style={{color:C.txt}}>함께 말하는 단계</strong>입니다. 6장의 수사가 향하는 핵심—<strong style={{color:C.txt}}>우리 자신의 생존이 신체 어떤 부위의 생존 여부에 좌우되지 않는다는 것을, 나는 어떻게 받아들이는가?</strong>
        </p>
      </div>
      <p style={{ fontFamily:F.b, fontSize:11, color:STAGES.rhetoric.color, letterSpacing:4, marginBottom:20 }}>세미나 토론 질문</p>
      {SEMINAR_QS.map((item,i)=>{
        const open=seminHints.has(i);
        return (
          <div key={i} style={{ marginBottom:20, background:C.surf, padding:"22px 26px", borderLeft:`3px solid ${STAGES.rhetoric.color}${i%2===0?"cc":"44"}` }}>
            <div style={{ display:"flex", gap:16, alignItems:"flex-start", marginBottom:12 }}>
              <span style={{ fontFamily:F.h, fontSize:28, color:STAGES.rhetoric.color, lineHeight:1, minWidth:34 }}>S{i+1}</span>
              <p style={{ ...BD, fontWeight:400, lineHeight:1.8, margin:0, flex:1 }}>{item.q}</p>
            </div>
            <div style={{ paddingLeft:50 }}>
              <button onClick={()=>{const n=new Set(seminHints);if(n.has(i))n.delete(i);else n.add(i);setSeminHints(n);}}
                style={{ background:"transparent", border:"none", color:C.muted, fontFamily:F.b, fontSize:11, letterSpacing:3, cursor:"pointer", padding:0 }}>
                {open?"힌트 접기 ↑":"힌트 보기 ↓"}
              </button>
              {open && (
                <div style={{ marginTop:10, padding:"12px 16px", background:C.surfUp, borderLeft:`2px solid ${STAGES.rhetoric.color}33` }}>
                  <p style={{ ...MT, fontSize:13, fontStyle:"italic", margin:0, lineHeight:1.8 }}>💡 {item.hint}</p>
                </div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );

  case 10: return (
    <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column", justifyContent:"center", alignItems:"center", textAlign:"center", padding:"48px 28px", background:C.bg, position:"relative" }}>
      <div style={{ position:"absolute", top:0, left:0, right:0, height:1, background:`linear-gradient(90deg,transparent,${C.gold}44,transparent)` }} />
      <span style={{ fontFamily:F.b, fontSize:11, letterSpacing:6, color:C.muted, marginBottom:48, display:"block" }}>디퍼 언브랜딩살롱 · 마침내 특이점이 시작된다</span>
      <div style={{ width:1, height:64, background:`linear-gradient(${C.gold}88,transparent)`, margin:"0 auto 44px" }} />
      <div style={{ background:C.surf, padding:"36px 40px", maxWidth:640, textAlign:"left", borderLeft:`3px solid ${C.gold}`, marginBottom:52 }}>
        <p style={{ fontSize:11, color:C.gold, letterSpacing:4, marginBottom:20 }}>오늘의 마지막 문장 · Ray Kurzweil · 제6장 · 향후 30년의 건강과 안녕</p>
        <p style={{ fontFamily:F.h, fontSize:"clamp(14px,2vw,17px)", fontStyle:"italic", color:C.txt, lineHeight:2.3, margin:0 }}>
          "이 미래는 기본적인 기하급수적 증가 추세에 달려있기 때문에 설령 우리 자신의 디지털화가 얼마나 쉽게 일어날 것인가에 대한 가정이 크게 변하더라도, 그 단계에 이르는 시점에는 큰 변화가 없을 것이다."
        </p>
        <p style={{ ...MT, fontSize:12, marginTop:20, marginBottom:0, letterSpacing:2 }}>— 『마침내 특이점이 시작된다』 제6장 향후 30년의 건강과 안녕</p>
      </div>
      <div style={{ display:"flex", gap:32, marginBottom:52, justifyContent:"center" }}>
        {[["문법","Grammar","#c4a35a"],["논리","Logic","#5a9abc"],["수사","Rhetoric","#bc7a7a"]].map(([l,e,col])=>(
          <div key={l} style={{ textAlign:"center" }}>
            <div style={{ width:5, height:5, borderRadius:"50%", background:col, margin:"0 auto 8px" }} />
            <p style={{ fontFamily:F.b, fontSize:11, color:col, letterSpacing:3, marginBottom:5 }}>{l}</p>
            <p style={{ fontFamily:F.h, fontSize:13, color:C.muted, margin:0, fontStyle:"italic" }}>{e}</p>
          </div>
        ))}
      </div>
      <button onClick={()=>go(0)} style={{ background:"transparent", border:`1px solid ${C.line}`, color:C.muted, fontFamily:F.b, fontSize:11, letterSpacing:4, padding:"12px 32px", cursor:"pointer" }}>처음으로</button>
    </div>
  );

  default: return null;
  }};

  const navVisible = page>0 && page<10;
  return (
    <div style={{ background:C.bg, minHeight:"100vh" }}>
      {navVisible && (
        <div style={{ position:"fixed", top:0, left:0, right:0, height:2, background:C.line, zIndex:100 }}>
          <div style={{ height:"100%", width:`${((page-1)/8)*100}%`, background:stage?stage.color:C.gold, transition:"width 0.4s ease, background 0.4s ease" }} />
        </div>
      )}
      <div style={{ opacity:fading?0:1, transition:"opacity 0.28s ease", paddingTop:navVisible?2:0 }}>
        {renderPage()}
      </div>
      {navVisible && (
        <div style={{ maxWidth:720, margin:"0 auto", padding:"0 28px 52px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <button onClick={prev} style={{ background:"transparent", border:"none", color:C.muted, fontFamily:F.b, fontSize:12, letterSpacing:3, cursor:"pointer", padding:"12px 0" }}>← 이전</button>
          <div style={{ display:"flex", gap:4, alignItems:"center", flexWrap:"wrap", justifyContent:"center", maxWidth:160 }}>
            {Array.from({length:9},(_,i)=>{
              const ps=PAGE_STAGE[i+2], col=ps?STAGES[ps].color:C.gold, active=i===page-2, done=i<page-2;
              return <div key={i} style={{ width:active?8:5, height:active?8:5, borderRadius:"50%", background:done||active?col:C.line, transition:"all 0.3s" }} />;
            })}
          </div>
          {page<9 ? (
            <button onClick={next} style={{ background:"transparent", border:"none", color:stage?stage.color:C.gold, fontFamily:F.b, fontSize:12, letterSpacing:3, cursor:"pointer", padding:"12px 0" }}>다음 →</button>
          ) : (
            <button onClick={next}
              onMouseEnter={e=>{e.currentTarget.style.background=STAGES.rhetoric.color;e.currentTarget.style.color=C.bg;}}
              onMouseLeave={e=>{e.currentTarget.style.background="transparent";e.currentTarget.style.color=STAGES.rhetoric.color;}}
              style={{ background:"transparent", border:`1px solid ${STAGES.rhetoric.color}`, color:STAGES.rhetoric.color, fontFamily:F.b, fontSize:11, letterSpacing:3, padding:"10px 24px", cursor:"pointer", transition:"all 0.3s" }}>
              마무리
            </button>
          )}
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
