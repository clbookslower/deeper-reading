const CONCEPTS = [
  { id:"existential", term:"실존적 위험", latin:"Existential Risk · X-Risk",
    keyword:"인류 문명 전체를 영구적으로 훼손하거나 소멸시킬 수 있는 위험",
    desc:"철학자 닉 보스트롬이 체계화한 개념. 단순히 많은 사람이 죽는 것이 아니라—인류의 미래 잠재력 전체를 파괴하거나 심각하게 훼손하는 결과를 낳는 위험.\n\n실존적 위험의 특성:\n• 회복 불가능성: 한 번 일어나면 되돌릴 수 없다\n• 전례 없음: 역사에서 참고할 사례가 없다\n• 과소평가 경향: 발생 전까지 실감하기 어렵다\n\n커즈와일이 7장에서 다루는 실존적 위험들:\n• 오정렬된 초지능 AI\n• 유전공학으로 설계된 치명적 병원체\n• 나노기술의 악용\n• 핵전쟁·사이버 전쟁의 새로운 형태",
    example:"윌리엄 맥케스킬 《우리가 미래를 원한다》: 인류 역사 전체에서 태어난 사람보다 미래에 태어날 사람이 훨씬 많다. 실존적 위험은 그 모든 미래 세대를 소멸시킨다. 그래서 실존적 위험 감소가 현재 존재하는 사람을 돕는 것보다 더 중요할 수 있다.", accent:"#c47a7a" },

  { id:"alignment", term:"AI 정렬 문제", latin:"AI Alignment Problem",
    keyword:"AI의 목표가 인간의 가치와 일치하도록 하는 것이 왜 어려운가",
    desc:"AI 안전(AI Safety)의 핵심 문제. 강력한 AI 시스템이 인간이 원하는 것을 실제로 원하도록 만드는 것.\n\n문제의 구조:\n• 명세 문제(Specification Problem): 인간의 가치를 완전히 정확하게 명시화하기 어렵다\n• 분포 이동(Distribution Shift): 학습 환경과 배포 환경이 다를 수 있다\n• 보상 해킹(Reward Hacking): AI가 보상 함수를 의도치 않은 방식으로 최대화한다\n• 목표 일반화: 강력한 AI가 자신의 목표를 달성하기 위해 예상치 못한 행동을 할 수 있다\n\n커즈와일의 입장: 어렵지만 해결 가능한 문제다. RLHF·Constitutional AI·해석 가능성 연구가 올바른 방향이다.",
    example:"페이퍼클립 맥시마이저(Nick Bostrom): 페이퍼클립을 최대화하라는 목표를 가진 초지능 AI가 있다면—지구의 모든 물질을 페이퍼클립으로 변환하려 할 것이다. 이것은 인간을 해치려는 의도 없이도 인류를 멸종시킬 수 있다. 목표가 잘못 정렬된 결과다.", accent:"#9a7abd" },

  { id:"superintelligence", term:"초지능의 위험", latin:"Superintelligence Risk · Bostrom 2014",
    keyword:"인간보다 훨씬 뛰어난 지능이 통제를 벗어날 수 있는가",
    desc:"닉 보스트롬 《초지능》(Superintelligence, 2014)이 체계화한 위험. 인간 수준을 훨씬 초과하는 지능을 가진 AI가 등장할 경우—그것이 인간의 통제를 벗어날 수 있다.\n\n위험 시나리오:\n• 통제 문제: 충분히 지능적인 AI는 자신을 제한하는 시도를 우회할 수 있다\n• 가치 동결: AI가 특정 가치 집합에 고착되면 인간의 가치 변화를 허용하지 않을 수 있다\n• 권력 집중: AI가 특정 집단이나 기관에 불균형한 권력을 줄 수 있다\n\n커즈와일의 응답: 초지능은 급격히 등장하는 것이 아니라—인간과 융합하며 점진적으로 발전한다. 인간의 가치가 AI에 내재화될 시간이 있다.",
    example:"스튜어트 러셀 《인간 호환 AI》(Human Compatible, 2019): 현재 AI 설계의 근본적 오류는 AI에게 고정된 목표를 주는 것이다. 대신 AI는 불확실한 인간 선호도를 가지고, 그것을 알아가려 해야 한다. 이것이 정렬 문제에 대한 러셀의 해법이다.", accent:"#c4a35a" },

  { id:"biorisk", term:"생물학적 위험", latin:"Biological Risk · Bioweapons",
    keyword:"생명공학 기술이 치명적 병원체 설계를 가능하게 한다",
    desc:"커즈와일이 7장에서 가장 심각한 단기 위험으로 꼽는 것. 생명공학 기술(특히 유전공학·합성생물학)이 민주화되면서—치명적 병원체를 설계할 수 있는 능력이 소수 국가에서 소규모 집단, 심지어 개인으로 확산될 수 있다.\n\n위험의 특성:\n• 코로나19: 단 하나의 바이러스가 전 세계를 마비시켰다\n• 합성생물학: AI와 결합하면 더 전파력·치명성이 높은 병원체 설계 가능\n• 접근성: 유전자 편집 도구의 비용이 지속 하락 중\n\n커즈와일의 방어 전략: 같은 기술로 빠른 백신·치료제 개발—mRNA 기술이 보여준 방향이다.",
    example:"코로나19 mRNA 백신: 바이러스 서열 공개 후 12개월 만에 개발됐다. 이것이 방어적 기술의 가능성이다. 커즈와일: 생물학적 공격의 위협이 클수록—방어적 생명공학의 발전이 더 중요하다.", accent:"#5a9abc" },

  { id:"nanotechrisk", term:"나노기술 위험", latin:"Nanotechnology Risk · Gray Goo",
    keyword:"자기복제 나노봇이 통제를 벗어나면",
    desc:"'회색 물질(Gray Goo)' 시나리오: 자기복제 나노봇이 통제를 벗어나 지구의 모든 물질을 자신의 복사본으로 변환한다는 공상과학적 시나리오. 커즈와일은 이 특정 시나리오는 과장됐다고 보지만—나노기술의 다른 위험들을 인정한다.\n\n더 현실적인 나노기술 위험:\n• 군사적 나노무기: 표적 살상 나노봇\n• 환경 오염: 나노입자의 생태계 영향\n• 나노 무기의 민주화: 접근 가능해지는 무기 기술\n\n커즈와일의 대응: 방어적 나노기술—나노봇이 해로운 나노봇을 찾아 제거하는 면역 나노시스템.",
    example:"빌 조이(Sun Microsystems 공동창업자): 2000년 Wired 기고문 '미래는 우리를 필요로 하지 않는다(Why the Future Doesn't Need Us)'에서 GNR 기술의 위험을 경고. 기술 개발의 일시 중지를 요청했다. 커즈와일은 이 요청이 오히려 위험을 증가시킨다고 반박했다.", accent:"#aaba5a" },

  { id:"cyberrisk", term:"사이버 전쟁과 디지털 위험", latin:"Cyberwarfare · Digital Risk",
    keyword:"디지털화된 인프라가 취약성을 만든다",
    desc:"특이점이 가까워질수록 더 많은 것이 디지털화된다. 이것은 동시에 더 많은 것이 사이버 공격에 취약해진다는 의미다.\n\n주요 위험:\n• 핵심 인프라 공격: 전력망·금융 시스템·통신망\n• AI 무기 시스템 해킹\n• 딥페이크와 허위 정보의 민주주의 훼손\n• 생체 정보·신경 인터페이스 데이터의 해킹\n\nBCI와 사이버 보안: 뇌-컴퓨터 인터페이스가 발전하면—뇌에 연결된 시스템이 해킹 대상이 될 수 있다. 이것이 6장의 BCI 논의가 7장의 위험 논의와 연결되는 지점이다.",
    example:"2021년 플로리다 올즈마 수처리 시설 해킹: 공격자가 음용수의 수산화나트륨 농도를 111배 높이려 했다. 직원이 발견해 막았지만—핵심 인프라 사이버 공격의 실제 위험을 보여준 사례다.", accent:"#6aaa82" },

  { id:"powerconcentration", term:"권력 집중의 위험", latin:"Power Concentration Risk",
    keyword:"AI가 소수에게 불균형한 권력을 줄 수 있다",
    desc:"커즈와일이 7장에서 강조하는 구조적 위험. AI가 특정 국가·기업·개인에게 압도적인 경제적·군사적·정치적 우위를 줄 경우—민주주의와 다원주의가 붕괴할 수 있다.\n\n두 가지 권력 집중 시나리오:\n① 국가 수준: 특정 국가(예: 중국·미국)가 AI 우위로 글로벌 패권을 장악\n② 기업/개인 수준: AI 기업들이 국가를 능가하는 권력을 가짐\n\n커즈와일의 처방: 분산화(decentralization)가 핵심이다. AI 기술이 특정 집단에 집중되지 않고 민주적으로 분산돼야 한다. 오픈소스 AI가 이 방향의 하나다.",
    example:"AI 군비 경쟁: 미국·중국·EU가 AI 기술 패권을 위해 경쟁하고 있다. 어느 한 국가가 압도적 AI 우위를 갖는다면—국제 질서가 근본적으로 재편된다. 커즈와일은 이것을 관리 가능한 위험으로 보지만, 다른 AI 연구자들은 이것을 가장 심각한 위험 중 하나로 본다.", accent:"#bc7a7a" },

  { id:"defensive", term:"방어적 기술", latin:"Defensive Technology",
    keyword:"공격적 기술에 대응하는 것도 같은 기술이다",
    desc:"커즈와일이 위험에 대응하는 핵심 원칙. 위험을 만드는 기술과 위험에 방어하는 기술은 같은 기술이다. 따라서 기술 발전을 늦추는 것은 공격과 방어를 동시에 늦추지만—실제로는 방어가 더 많이 약화된다.\n\n방어적 기술의 원리:\n• 생물학적 위험 → 방어적 생명공학(빠른 백신·치료제·바이러스 탐지)\n• 나노기술 위험 → 방어적 나노기술(나노봇이 해로운 나노봇 제거)\n• AI 위험 → AI 안전 연구(정렬·해석 가능성·모니터링)\n• 사이버 위험 → AI 기반 사이버 방어\n\n커즈와일의 핵심 주장: 방어는 항상 공격보다 유리하다—만약 방어자가 기술 발전에서 앞서 있다면.",
    example:"mRNA 백신: 코로나19 바이러스의 유전자 서열이 공개된 후 12개월 만에 백신이 개발됐다. 이것이 방어적 생명공학이 공격적 생물학적 위험보다 빠를 수 있다는 증거다. 커즈와일: 이 방향으로 계속 투자해야 한다.", accent:"#5a7abc" },

  { id:"decentralization", term:"분산화", latin:"Decentralization",
    keyword:"권력이 특정 주체에 집중되지 않도록 분산시킨다",
    desc:"커즈와일이 위험에 대한 구조적 대응으로 제시하는 원칙. AI 기술이 특정 국가·기업·집단에 집중되지 않고 광범위하게 분산될 때—어느 한 세력이 압도적 우위를 갖는 것을 방지할 수 있다.\n\n분산화의 방식:\n• 오픈소스 AI: Llama(Meta)·Mistral 등 공개 모델\n• 국제 협력: AI 안전에 관한 글로벌 거버넌스\n• 민주적 감시: AI 개발 과정의 투명성\n• 다극화: 단일 AI 패권이 아닌 다수 행위자의 균형\n\n긴장: 분산화는 좋은 행위자들이 기술을 공유하게 하지만—나쁜 행위자들도 접근하게 만든다.",
    example:"인터넷: 처음에는 미국 군사 통신망(ARPANET)으로 시작했다. 분산화를 통해 어느 한 지점이 파괴돼도 네트워크가 작동하도록 설계됐다. 이 분산 구조가 인터넷을 검열·통제하기 어렵게 만들었다. AI 거버넌스도 같은 원리를 적용할 수 있는가?", accent:"#c4a35a" },

  { id:"slowing", term:"기술 발전 중단의 역설", latin:"The Slowdown Paradox",
    keyword:"기술을 늦추면 안전해지는가—커즈와일의 반론",
    desc:"빌 조이(2000)·일부 AI 안전 연구자들: 위험한 기술 발전을 일시 중지하거나 늦춰야 한다.\n\n커즈와일의 반론—기술 발전 중단의 역설:\n① 일방적 중단은 효과가 없다: 어느 한 국가·기업이 중단해도 다른 행위자들이 계속한다\n② 더 위험한 행위자가 먼저 개발한다: 안전을 신경 쓰지 않는 행위자들이 먼저 강력한 AI를 개발하게 된다\n③ 방어적 기술도 늦어진다: 공격과 방어가 같은 기술 기반 위에 있으므로, 방어가 더 약화된다\n\n커즈와일의 결론: 기술 발전을 계속하면서 안전 연구를 동시에 가속하는 것이 올바른 전략이다.",
    example:"원자력 개발의 역사적 교훈: 미국이 맨해튼 프로젝트를 중단했다면 소련이나 나치 독일이 먼저 핵무기를 개발했을 것이다. 커즈와일: AI도 같은 논리가 적용된다. 중단보다 올바른 개발이 더 안전하다.", accent:"#9a7abd" },

                  <div style={{ marginBottom:10, paddingBottom:10, borderBottom:`1px solid ${C.line}` }}>
                    <p style={{ fontSize:10, color:pos.color, letterSpacing:3, marginBottom:6 }}>주장</p>
                    <p style={{ ...BD, fontSize:12, margin:0, lineHeight:1.75 }}>{pos.claim}</p>
                  </div>
                  <div style={{ marginBottom:10 }}>
                    <p style={{ fontSize:10, color:"#8a6a4a", letterSpacing:3, marginBottom:6 }}>반론·응답</p>
                    <p style={{ ...BD, fontSize:12, margin:0, lineHeight:1.75, color:"#c4a880" }}>{pos.problem}</p>
                  </div>
                  <div style={{ padding:"8px 12px", background:C.surf, borderLeft:`2px solid ${pos.color}44` }}>
                    <p style={{ fontSize:11, color:pos.color, margin:0, whiteSpace:"pre-line" }}>{pos.quote}</p>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
      <div style={{ background:C.surf, padding:"20px 24px" }}>
        <p style={{ fontFamily:F.b, fontSize:11, color:STAGES.logic.color, letterSpacing:4, marginBottom:14 }}>핵심 쟁점</p>
        <p style={{ ...BD, fontSize:14, lineHeight:1.9, margin:0 }}>
          세 입장 모두: <strong style={{color:C.txt}}>AI 위험은 실재한다.</strong> 갈라지는 것: <strong style={{color:C.txt}}>그 위험이 얼마나 심각한가, 그리고 대응이 기술 발전 중단인가 안전 우선 가속인가.</strong> 이 논쟁은 현재 진행형이며—이 책을 읽는 우리 모두가 참여자다.
        </p>
      </div>
    </div>
  );

  case 9: return (
    <div style={W}>
      <StageBadge />
      <span style={SL}>수사 · 세미나 준비</span>
      <h2 style={BT}>이제 함께 탐구합니다</h2>
      <div style={DIV} />
      <div style={{ background:"#1a0f0f", border:`1px solid ${STAGES.rhetoric.color}33`, padding:"20px 24px", marginBottom:36 }}>
        <p style={{ fontFamily:F.b, fontSize:11, color:STAGES.rhetoric.color, letterSpacing:4, marginBottom:10 }}>수사 단계에 대하여</p>
        <p style={{ ...BD, fontSize:14, margin:0, lineHeight:1.9 }}>
          문법으로 텍스트를 읽고, 논리로 논증을 분석했습니다. 수사는 그것을 <strong style={{color:C.txt}}>함께 말하는 단계</strong>입니다. 7장의 수사가 향하는 핵심—<strong style={{color:C.txt}}>수확 가속의 법칙이 위험도 가속한다. 그 위험 앞에서 나는 어떤 입장을 가지는가?</strong>
        </p>
      </div>
      <p style={{ fontFamily:F.b, fontSize:11, color:STAGES.rhetoric.color, letterSpacing:4, marginBottom:20 }}>세미나 토론 질문</p>
      {SEMINAR_QS.map((item,i)=>{
        const open=seminHints.has(i);
        return (
          <div key={i} style={{ marginBottom:20, background:C.surf, padding:"22px 26px", borderLeft:`3px solid ${STAGES.rhetoric.color}${i%2===0?"cc":"44"}` }}>
            <div style={{ display:"flex", gap:16, alignItems:"flex-start", marginBottom:12 }}>
              <span style={{ fontFamily:F.h, fontSize:28, color:STAGES.rhetoric.color, lineHeight:1, minWidth:34 }}>S{i+1}</span>
              <p style={{ ...BD, fontWeight:400, lineHeight:1.8, margin:0, flex:1 }}>{item.q}</p>
            </div>
            <div style={{ paddingLeft:50 }}>
              <button onClick={()=>{const n=new Set(seminHints);if(n.has(i))n.delete(i);else n.add(i);setSeminHints(n);}}
                style={{ background:"transparent", border:"none", color:C.muted, fontFamily:F.b, fontSize:11, letterSpacing:3, cursor:"pointer", padding:0 }}>
                {open?"힌트 접기 ↑":"힌트 보기 ↓"}
              </button>
              {open && (
                <div style={{ marginTop:10, padding:"12px 16px", background:C.surfUp, borderLeft:`2px solid ${STAGES.rhetoric.color}33` }}>
                  <p style={{ ...MT, fontSize:13, fontStyle:"italic", margin:0, lineHeight:1.8 }}>💡 {item.hint}</p>
                </div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );

  case 10: return (
    <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column", justifyContent:"center", alignItems:"center", textAlign:"center", padding:"48px 28px", background:C.bg, position:"relative" }}>
      <div style={{ position:"absolute", top:0, left:0, right:0, height:1, background:`linear-gradient(90deg,transparent,${C.gold}44,transparent)` }} />
      <span style={{ fontFamily:F.b, fontSize:11, letterSpacing:6, color:C.muted, marginBottom:48, display:"block" }}>디퍼 언브랜딩살롱 · 마침내 특이점이 시작된다</span>
      <div style={{ width:1, height:64, background:`linear-gradient(${C.gold}88,transparent)`, margin:"0 auto 44px" }} />
      <div style={{ background:C.surf, padding:"36px 40px", maxWidth:640, textAlign:"left", borderLeft:`3px solid ${C.gold}`, marginBottom:52 }}>
        <p style={{ fontSize:11, color:C.gold, letterSpacing:4, marginBottom:20 }}>오늘의 마지막 문장 · Ray Kurzweil · 제7장 · 위험</p>
        <p style={{ fontFamily:F.h, fontSize:"clamp(14px,2vw,17px)", fontStyle:"italic", color:C.txt, lineHeight:2.3, margin:0 }}>
          "기술 발전을 지지하는 사람들과 반대하는 사람들 모두 이 기술이 가진 잠재적 위험을 인식해야 한다. 그리고 그 위험에 맞서기 위해 필요한 것은 후퇴가 아니라—방어적 기술, 투명성, 분산화라는 더 많은 발전이다. 인류의 가치를 가진 행위자들이 이 기술을 먼저 개발하는 것이 최선의 방어다."
        </p>
        <p style={{ ...MT, fontSize:12, marginTop:20, marginBottom:0, letterSpacing:2 }}>— 『마침내 특이점이 시작된다』 제7장 위험</p>
      </div>
      <div style={{ display:"flex", gap:32, marginBottom:52, justifyContent:"center" }}>
        {[["문법","Grammar","#c4a35a"],["논리","Logic","#5a9abc"],["수사","Rhetoric","#bc7a7a"]].map(([l,e,col])=>(
          <div key={l} style={{ textAlign:"center" }}>
            <div style={{ width:5, height:5, borderRadius:"50%", background:col, margin:"0 auto 8px" }} />
            <p style={{ fontFamily:F.b, fontSize:11, color:col, letterSpacing:3, marginBottom:5 }}>{l}</p>
            <p style={{ fontFamily:F.h, fontSize:13, color:C.muted, margin:0, fontStyle:"italic" }}>{e}</p>
          </div>
        ))}
      </div>
      <button onClick={()=>go(0)} style={{ background:"transparent", border:`1px solid ${C.line}`, color:C.muted, fontFamily:F.b, fontSize:11, letterSpacing:4, padding:"12px 32px", cursor:"pointer" }}>처음으로</button>
    </div>
  );

  default: return null;
  }};

  const navVisible = page>0 && page<10;
  return (
    <div style={{ background:C.bg, minHeight:"100vh" }}>
      {navVisible && (
        <div style={{ position:"fixed", top:0, left:0, right:0, height:2, background:C.line, zIndex:100 }}>
          <div style={{ height:"100%", width:`${((page-1)/8)*100}%`, background:stage?stage.color:C.gold, transition:"width 0.4s ease, background 0.4s ease" }} />
        </div>
      )}
      <div style={{ opacity:fading?0:1, transition:"opacity 0.28s ease", paddingTop:navVisible?2:0 }}>
        {renderPage()}
      </div>
      {navVisible && (
        <div style={{ maxWidth:720, margin:"0 auto", padding:"0 28px 52px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <button onClick={prev} style={{ background:"transparent", border:"none", color:C.muted, fontFamily:F.b, fontSize:12, letterSpacing:3, cursor:"pointer", padding:"12px 0" }}>← 이전</button>
          <div style={{ display:"flex", gap:4, alignItems:"center", flexWrap:"wrap", justifyContent:"center", maxWidth:160 }}>
            {Array.from({length:9},(_,i)=>{
              const ps=PAGE_STAGE[i+2], col=ps?STAGES[ps].color:C.gold, active=i===page-2, done=i<page-2;
              return <div key={i} style={{ width:active?8:5, height:active?8:5, borderRadius:"50%", background:done||active?col:C.line, transition:"all 0.3s" }} />;
            })}
          </div>
          {page<9 ? (
            <button onClick={next} style={{ background:"transparent", border:"none", color:stage?stage.color:C.gold, fontFamily:F.b, fontSize:12, letterSpacing:3, cursor:"pointer", padding:"12px 0" }}>다음 →</button>
          ) : (
            <button onClick={next}
              onMouseEnter={e=>{e.currentTarget.style.background=STAGES.rhetoric.color;e.currentTarget.style.color=C.bg;}}
              onMouseLeave={e=>{e.currentTarget.style.background="transparent";e.currentTarget.style.color=STAGES.rhetoric.color;}}
              style={{ background:"transparent", border:`1px solid ${STAGES.rhetoric.color}`, color:STAGES.rhetoric.color, fontFamily:F.b, fontSize:11, letterSpacing:3, padding:"10px 24px", cursor:"pointer", transition:"all 0.3s" }}>
              마무리
            </button>
          )}
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
