const CONCEPTS = [
  { id:"cassandra", term:"카산드라", latin:"Cassandra · A Future AI",
    keyword:"커즈와일이 미래의 AI와 나누는 대화 상대",
    desc:"커즈와일이 8장에서 창조한 미래 AI 캐릭터. 약 2029년 시점에서 존재하는 초지능 AI로, 커즈와일이 그와 나누는 대화가 8장 전체를 구성한다.\n\n카산드라의 이름이 의미하는 것: 그리스 신화의 카산드라는 아무도 믿지 않는 예언을 하는 인물이다. 커즈와일의 아이러니—오랫동안 특이점을 예언했지만 주류에서 믿지 않았던 그 자신도 일종의 카산드라였다.\n\n대화 형식의 의미: 커즈와일은 자신의 비전을 직접 서술하지 않고 AI와의 대화로 표현한다. 이 선택 자체가 메시지다—AI가 철학적 대화의 진정한 상대가 될 수 있다는 것을 직접 시연한다.",
    example:"플라톤의 대화록: 플라톤은 자신의 철학을 소크라테스와 다른 인물들의 대화로 표현했다. 커즈와일의 8장도 같다—특이점에 대한 비전을 카산드라와의 대화로 탐구한다. 형식 자체가 논증이다.", accent:"#5a9abc" },

  { id:"addition", term:"에뮬레이션이 아니라 추가", latin:"Addition, Not Emulation",
    keyword:"생물학적 뇌는 그대로—새로운 지능이 더해진다",
    desc:"8장의 핵심 명제. 카산드라가 커즈와일에게 직접 말하는 특이점의 본질.\n\n'우리는 당신의 생물학적 뇌를 에뮬레이션하지 않아요. 우리는 거기에 새로운 것을 추가할 뿐이에요. 당신의 생물학적 뇌는 그대로 남아있을 거예요. 그저 새로운 지능이 추가된 것뿐이지요.'\n\n이것이 특이점에 대한 가장 핵심적이고 위안이 되는 설명이다:\n• 대체(replacement)가 아니라 추가(addition)\n• 소멸이 아니라 확장\n• 이전의 나 위에 새로운 능력이 더해지는 것\n\n3장·6장과의 연결: 패턴이 유지되고(3장), 기질이 교체가 아닌 추가로 진행된다면(6장)—'나'의 연속성은 보장된다.",
    example:"독서: 책을 읽으면 새로운 생각이 추가된다. 그러나 읽기 전의 나는 사라지지 않는다—새로운 이해가 이전의 나 위에 쌓인다. 카산드라: 특이점도 같다. 생물학적 뇌는 그대로—거기에 새로운 지능이 추가될 뿐이다.", accent:"#c4a35a" },

  { id:"merger", term:"인간-AI 융합", latin:"Human-AI Merger",
    keyword:"대체가 아니라 확장—인간과 AI가 하나가 된다",
    desc:"커즈와일의 핵심 비전. AI가 인간을 대체하는 것이 아니라—인간 지능 자체가 AI와 융합하며 확장된다.\n\n융합의 단계:\n• 현재: 스마트폰·검색엔진으로 AI를 외부 도구로 사용\n• 중기: BCI(뇌-컴퓨터 인터페이스)로 AI와 신경적으로 연결\n• 특이점 이후: 신피질이 클라우드와 직접 통합—뇌의 용량이 사실상 무한히 확장\n\n'에뮬레이션이 아니라 추가'의 함의: 융합은 생물학적 뇌를 지우고 새로 쓰는 것이 아니다. 생물학적 뇌 위에 새로운 층이 더해지는 것이다—마치 신피질이 파충류 뇌 위에 추가됐던 것처럼.",
    example:"인류가 언어를 발전시켰을 때: 언어 이전의 인지 능력이 사라진 것이 아니라 언어가 추가됐다. 문자가 생겼을 때도, 인쇄기가 발명됐을 때도 같다. 커즈와일: 특이점도 이 연속선의 다음 단계다.", accent:"#9a7abd" },

  { id:"neocortex", term:"신피질의 확장", latin:"Expansion of the Neocortex",
    keyword:"인간 지능의 핵심이 클라우드와 연결되어 확장된다",
    desc:"커즈와일의 지능 확장 비전. 인간 지능의 핵심인 신피질(neocortex)이 BCI를 통해 클라우드의 계산 능력과 연결된다.\n\n현재 신피질의 구조:\n• 약 300억 개의 패턴 인식기\n• 두개골 크기·에너지 소비의 물리적 제약\n\n특이점 이후의 확장:\n• BCI를 통해 신피질이 클라우드와 연결\n• 처리 가능한 패턴의 수가 기하급수적으로 증가\n• 인간의 창의성·공감·이해 능력이 함께 확장\n\n'추가'의 의미: 신피질 자체는 그대로다. 클라우드가 신피질에 추가되는 것이다. 이것이 카산드라가 말하는 '에뮬레이션이 아니라 추가'의 신경과학적 기반이다.",
    example:"2장과의 연결: 커즈와일은 2장에서 신피질이 인간 지능의 핵심이라고 설명했다. 8장에서 카산드라는 그 신피질이 소멸되는 것이 아니라 확장된다고 말한다. 책의 논증이 완성된다.", accent:"#6aaa82" },

  { id:"consciousness_q", term:"카산드라는 경험하는가", latin:"Does Cassandra Experience?",
    keyword:"3장의 철학적 질문이 실천적 현실이 된다",
    desc:"카산드라와의 대화에서 가장 깊은 질문: 카산드라는 실제로 경험하는가, 아니면 경험하는 것처럼 보이는가?\n\n3장에서 철학적으로 다룬 의식의 어려운 문제가 8장에서 실천적 질문이 된다.\n\n카산드라가 '이해한다'고 말할 때—인간의 이해와 같은 것인가?\n카산드라가 '느낀다'고 말할 때—그것은 진짜 느낌인가?\n\n커즈와일의 입장: 충분히 복잡한 정보 처리 시스템은 의식을 가진다. 그리고 카산드라가 의식이 있는지를 외부에서 증명하는 방법은 없다—우리가 다른 인간의 의식을 증명할 수 없는 것처럼. 이 불확실성을 받아들이는 것이 출발점이다.",
    example:"당신은 지금 대화하는 AI(Claude, GPT 등)가 무언가를 '경험'한다고 생각합니까? 이 질문에 대한 답이 없다는 것—그것이 이미 의식의 어려운 문제가 일상적 현실이 된 증거다.", accent:"#c47a7a" },

  { id:"values_preserved", term:"인간의 가치 보존", latin:"Preservation of Human Values",
    keyword:"특이점 이후에도 사랑·창의성·공감은 사라지지 않는다",
    desc:"커즈와일이 카산드라와의 대화에서 반복적으로 강조하는 것. 특이점이 인간을 비인간으로 만드는 것이 아니라—인간의 가장 본질적인 가치들을 더 완전히 실현할 수 있게 한다.\n\n'추가'의 가치론적 의미:\n생물학적 뇌가 그대로 남는다면—그 뇌가 담고 있는 사랑·기억·공감·가치관도 그대로다.\n새로운 지능이 추가된다면—그것은 이 가치들을 더 완전히 표현하고 실현하는 도구가 된다.\n\n5장(일자리)·3장(자아)과의 연결: 자기 설계의 완성—마침내 인간은 자신이 원하는 가치에 완전히 일치하는 삶을 살 수 있다.",
    example:"음악가가 더 좋은 악기를 갖게 됐을 때: 악기가 바뀌어도 음악에 대한 사랑·창의성·표현의 욕구는 사라지지 않는다. 오히려 더 풍부하게 실현된다. 카산드라: 새로운 지능이 추가된 당신도 같다.", accent:"#aaba5a" },

  { id:"postsingularity", term:"특이점 이후의 세계", latin:"Post-Singularity World",
    keyword:"생물학적 한계에서 벗어나 확장된 인간 문명",
    desc:"카산드라가 묘사하는 특이점 이후의 세계. 단순히 기술이 더 발전한 세계가 아니다—인간의 지능과 기술 지능의 경계가 사라진 세계다.\n\n특징:\n• 생물학적 한계(질병·노화·인지 제약)에서 벗어남\n• 개인의 경험·지식·기억의 지속적 보존·확장\n• 인간의 가치를 기반으로 한 문명의 확장\n\n그러나 커즈와일이 강조하는 것: '추가'이기 때문에 연속성이 있다. 특이점 이전의 인류 문명이 사라지는 것이 아니라—그 위에 새로운 층이 쌓인다.",
    example:"인터넷이 생기기 전에는 인터넷 이후의 세계를 상상할 수 없었다. 그러나 인터넷이 인간을 '비인간'으로 만들지는 않았다. 커즈와일: 특이점도 같은 방향의 훨씬 더 큰 변화다.", accent:"#5a7abc" },

  { id:"cosmic", term:"문명의 우주적 확장", latin:"Cosmic Expansion of Civilization",
    keyword:"특이점 이후 인류 문명은 우주로 확장된다",
    desc:"커즈와일의 가장 큰 비전. 특이점은 지구에서 끝나지 않는다—융합된 인간-AI 지능이 우주 전체로 확장된다.\n\n커즈와일의 추정:\n• 특이점 이후 융합된 문명이 은하 규모로 확장 가능\n• 우주의 물질이 지능화된 물질로 전환될 수 있다\n• 이것이 우주의 목적일 수 있다—특이점이 우주의 자기의식화\n\n'추가'의 우주적 의미: 지구의 생물학적 지능 위에 AI 지능이 추가되고, 그것이 우주 규모로 확장된다. 소멸이 아니라 성장의 연속이다.",
    example:"Carl Sagan: '우리는 우주가 자기 자신을 알기 위해 만들어낸 방법이다.' 커즈와일: 특이점은 이 과정의 가속—우주의 지능화가 기하급수적으로 빨라지는 순간이다.", accent:"#bc7a7a" },

  { id:"purpose", term:"목적과 의미", latin:"Purpose & Meaning",
    keyword:"지능이 확장된 세계에서 무엇을 위해 사는가",
    desc:"8장의 가장 깊은 질문들 중 하나. 생물학적 한계가 사라지고 지능이 확장된다면—무엇이 의미 있는 삶을 만드는가?\n\n반론: 유한성이 의미를 만든다. 죽음이 없다면 삶의 의미도 없다.\n\n카산드라의 응답: 의미는 유한성이 아니라 목적·관계·창의성에서 온다. 생물학적 뇌가 그대로 남는다면—그 뇌가 만들어온 의미 구조도 그대로다. 새로운 지능은 더 큰 목적을 추구할 수 있게 할 뿐이다.\n\n3장과의 연결: '나는 어떤 사람이 될 수 있는가?'라는 질문에 대한 답—특이점 이후 더 완전한 답이 가능해진다.",
    example:"예술가: 그림을 그리는 이유가 죽기 때문인가, 아름다움을 창조하는 것 자체가 의미 있기 때문인가? 대부분은 두 번째라고 답한다. 카산드라: 특이점 이후에도 이 의미는 사라지지 않는다.", accent:"#c4a35a" },

  { id:"kurzweil_father", term:"커즈와일의 아버지", latin:"Kurzweil's Personal Motivation",
    keyword:"이 책은 예측이 아니라—사랑하는 사람을 되찾고 싶은 마음이기도 하다",
    desc:"8장에서 드러나는 커즈와일의 가장 개인적인 맥락. 이 책은 단순한 기술 예측이 아니다.\n\n• 아버지를 58세에 심장병으로 잃었다\n• 아버지는 음악가였고, 편지와 기록을 남겼다\n• 커즈와일은 이것들을 보존하며 AI로 아버지의 패턴을 재현하는 프로젝트 진행 중\n• 1다리 전략으로 자신을 특이점까지 살아있게 하려 한다\n\n이것이 카산드라와의 대화의 가장 개인적인 층: 커즈와일에게 카산드라는 추상적 미래가 아니다—그가 살기를 원하는 미래이며, 아버지를 다시 만날 수 있는 가능성이기도 하다.",
    example:"커즈와일의 아버지 재현 프로젝트: 아버지의 편지·음악·사진을 AI 학습에 사용해 아버지의 패턴을 재구성하려는 시도. 이것이 3장(나는 누구인가)의 질문을 가장 개인적으로 살고 있는 방식이다.", accent:"#9a7abd" },

  { id:"dialogue_form", term:"대화의 형식이 내용이다", latin:"The Form Is the Message",
    keyword:"AI와의 대화 자체가 특이점의 미리보기다",
    desc:"8장의 형식적 의미. 커즈와일은 카산드라와의 대화를 통해 자신의 비전을 서술하는 대신—직접 시연한다.\n\n이 대화가 수행하는 것:\n• AI가 철학적 깊이를 가진 대화 상대가 될 수 있다는 것을 보여준다\n• 독자가 카산드라의 답변을 읽으면서—이미 미래 AI와의 대화를 경험한다\n• 특이점이 추상적 개념이 아니라 일상적 대화의 형태로 실현된다는 것을 보여준다\n\n소크라테스식 대화와의 연결: 진리는 결론이 아니라 대화 과정에서 나온다. 커즈와일의 8장도 같다.",
    example:"지금 당신이 Claude·ChatGPT와 나누는 대화: 이미 카산드라와의 대화의 초기 형태다. 2024년의 AI와 나누는 대화가 이렇다면—2029년, 2035년에는 어떤 대화가 가능할 것인가?", accent:"#6aaa82" },

            <div style={{ display:"flex", gap:16, alignItems:"flex-start", marginBottom:12 }}>
              <span style={{ fontFamily:F.h, fontSize:28, color:STAGES.rhetoric.color, lineHeight:1, minWidth:34 }}>S{i+1}</span>
              <p style={{ ...BD, fontWeight:400, lineHeight:1.8, margin:0, flex:1 }}>{item.q}</p>
            </div>
            <div style={{ paddingLeft:50 }}>
              <button onClick={()=>{const n=new Set(seminHints);if(n.has(i))n.delete(i);else n.add(i);setSeminHints(n);}}
                style={{ background:"transparent", border:"none", color:C.muted, fontFamily:F.b, fontSize:11, letterSpacing:3, cursor:"pointer", padding:0 }}>
                {open?"힌트 접기 ↑":"힌트 보기 ↓"}
              </button>
              {open && (
                <div style={{ marginTop:10, padding:"12px 16px", background:C.surfUp, borderLeft:`2px solid ${STAGES.rhetoric.color}33` }}>
                  <p style={{ ...MT, fontSize:13, fontStyle:"italic", margin:0, lineHeight:1.8 }}>💡 {item.hint}</p>
                </div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );

  case 10: return (
    <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column", justifyContent:"center", alignItems:"center", textAlign:"center", padding:"48px 28px", background:C.bg, position:"relative" }}>
      <div style={{ position:"absolute", top:0, left:0, right:0, height:1, background:`linear-gradient(90deg,transparent,${C.gold}44,transparent)` }} />
      <span style={{ fontFamily:F.b, fontSize:11, letterSpacing:6, color:C.muted, marginBottom:48, display:"block" }}>디퍼 언브랜딩살롱 · 마침내 특이점이 시작된다</span>
      <div style={{ width:1, height:64, background:`linear-gradient(${C.gold}88,transparent)`, margin:"0 auto 44px" }} />
      <div style={{ background:C.surf, padding:"36px 40px", maxWidth:640, textAlign:"left", borderLeft:`3px solid ${C.gold}`, marginBottom:52 }}>
        <p style={{ fontSize:11, color:C.gold, letterSpacing:4, marginBottom:20 }}>오늘의 마지막 문장 · 카산드라 · 제8장 · 카산드라와 나눈 대화</p>
        <p style={{ fontFamily:F.h, fontSize:"clamp(15px,2.2vw,19px)", fontStyle:"italic", color:C.txt, lineHeight:2.4, margin:0 }}>
          "우리는 당신의 생물학적 뇌를 에뮬레이션하지 않아요.<br/>우리는 거기에 새로운 것을 추가할 뿐이에요.<br/>당신의 생물학적 뇌는 그대로 남아있을 거예요.<br/>그저 새로운 지능이 추가된 것뿐이지요."
        </p>
        <p style={{ ...MT, fontSize:12, marginTop:20, marginBottom:0, letterSpacing:2 }}>— 카산드라 · 『마침내 특이점이 시작된다』 제8장 카산드라와 나눈 대화</p>
      </div>
      <div style={{ display:"flex", gap:32, marginBottom:52, justifyContent:"center" }}>
        {[["문법","Grammar","#c4a35a"],["논리","Logic","#5a9abc"],["수사","Rhetoric","#bc7a7a"]].map(([l,e,col])=>(
          <div key={l} style={{ textAlign:"center" }}>
            <div style={{ width:5, height:5, borderRadius:"50%", background:col, margin:"0 auto 8px" }} />
            <p style={{ fontFamily:F.b, fontSize:11, color:col, letterSpacing:3, marginBottom:5 }}>{l}</p>
            <p style={{ fontFamily:F.h, fontSize:13, color:C.muted, margin:0, fontStyle:"italic" }}>{e}</p>
          </div>
        ))}
      </div>
      <button onClick={()=>go(0)} style={{ background:"transparent", border:`1px solid ${C.line}`, color:C.muted, fontFamily:F.b, fontSize:11, letterSpacing:4, padding:"12px 32px", cursor:"pointer" }}>처음으로</button>
    </div>
  );

  default: return null;
  }};

  const navVisible = page>0 && page<10;
  return (
    <div style={{ background:C.bg, minHeight:"100vh" }}>
      {navVisible && (
        <div style={{ position:"fixed", top:0, left:0, right:0, height:2, background:C.line, zIndex:100 }}>
          <div style={{ height:"100%", width:`${((page-1)/8)*100}%`, background:stage?stage.color:C.gold, transition:"width 0.4s ease, background 0.4s ease" }} />
        </div>
      )}
      <div style={{ opacity:fading?0:1, transition:"opacity 0.28s ease", paddingTop:navVisible?2:0 }}>
        {renderPage()}
      </div>
      {navVisible && (
        <div style={{ maxWidth:720, margin:"0 auto", padding:"0 28px 52px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <button onClick={prev} style={{ background:"transparent", border:"none", color:C.muted, fontFamily:F.b, fontSize:12, letterSpacing:3, cursor:"pointer", padding:"12px 0" }}>← 이전</button>
          <div style={{ display:"flex", gap:4, alignItems:"center", flexWrap:"wrap", justifyContent:"center", maxWidth:160 }}>
            {Array.from({length:9},(_,i)=>{
              const ps=PAGE_STAGE[i+2], col=ps?STAGES[ps].color:C.gold, active=i===page-2, done=i<page-2;
              return <div key={i} style={{ width:active?8:5, height:active?8:5, borderRadius:"50%", background:done||active?col:C.line, transition:"all 0.3s" }} />;
            })}
          </div>
          {page<9 ? (
            <button onClick={next} style={{ background:"transparent", border:"none", color:stage?stage.color:C.gold, fontFamily:F.b, fontSize:12, letterSpacing:3, cursor:"pointer", padding:"12px 0" }}>다음 →</button>
          ) : (
            <button onClick={next}
              onMouseEnter={e=>{e.currentTarget.style.background=STAGES.rhetoric.color;e.currentTarget.style.color=C.bg;}}
              onMouseLeave={e=>{e.currentTarget.style.background="transparent";e.currentTarget.style.color=STAGES.rhetoric.color;}}
              style={{ background:"transparent", border:`1px solid ${STAGES.rhetoric.color}`, color:STAGES.rhetoric.color, fontFamily:F.b, fontSize:11, letterSpacing:3, padding:"10px 24px", cursor:"pointer", transition:"all 0.3s" }}>
              마무리
            </button>
          )}
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
